<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Deutsch Lernstudio 🐱</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#222}.app{max-width:900px;margin:auto;padding:28px 18px 60px}h1{margin-bottom:6px}.sub,.meta{color:#777}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 18px}.tab,button{border:0;border-radius:12px;padding:10px 15px;cursor:pointer;font-size:15px}.tab{background:#e8e9ef}.tab.active,.primary{background:#222;color:white}.card{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.word{font-size:36px;font-weight:700;margin:8px 0}.meaning{font-size:20px;margin:18px 0}.example{background:#f4f5f8;border-radius:14px;padding:14px;margin-top:14px}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.secondary{background:#e9edf7}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;margin:6px 0 12px}label{font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.stats{margin-top:14px;color:#666}.tag{display:inline-block;background:#eee;padding:4px 8px;border-radius:8px;font-size:12px;margin-bottom:8px}.answer{font-size:21px;font-weight:600;margin:14px 0}.hidden{display:none}.exam{border:2px solid #eee}.exam h2{margin-top:0}.speakbtn{background:#e8f0ff}.notice{font-size:14px;color:#666;margin-top:8px}.complaint .item{background:#f4f5f8;border-radius:14px;padding:14px;margin:10px 0}.complaint .de{font-weight:650;font-size:16px}.complaint .zh{color:#666;margin-top:6px}</style></head><body><div class="app"><h1>Deutsch Lernstudio 🐱</h1><p class="sub">单词 · 句子 · 动词变位 · TELC 口语 · B2 写作</p><div class="tabs"><button class="tab active" onclick="show('review',this)">复习</button><button class="tab" onclick="show('words',this)">单词</button><button class="tab" onclick="show('sentences',this)">句子</button><button class="tab" onclick="show('verbs',this)">变位</button><button class="tab" onclick="show('complaint',this)">📝 投诉信</button></div><section id="review" class="card"></section><section id="words" class="card" hidden></section><section id="sentences" class="card" hidden></section><section id="verbs" class="card" hidden></section><section id="complaint" class="card complaint" hidden></section></div><script>
const key='miaomiao-deutsch-data-v1';
const examSentences=[['Ich möchte kurz über ... sprechen.','我想简单谈谈……','Teil 1 开始介绍主题。'],['Ich habe mich für dieses Thema entschieden, weil ...','我选择这个主题是因为……','介绍为什么选择这个经验/人物。'],['Das war für mich eine besondere Erfahrung, weil ...','这对我来说是一次特别的经历，因为……','经验题万能句。'],['Besonders gut gefallen hat mir, dass ...','我尤其喜欢的是……','描述积极感受。'],['Was ich daran besonders interessant fand, war ...','我觉得其中特别有意思的是……','展开细节。'],['Wenn ich mich richtig erinnere, ...','如果我没记错的话……','不确定细节时使用。'],['Insgesamt war das eine Erfahrung, die ich nicht vergessen werde.','总的来说，这是一次我不会忘记的经历。','经验题结尾。'],['Eine Person, die mir besonders wichtig ist, ist ...','一个对我特别重要的人是……','Teil 1 人物题开头。'],['Ich kenne diese Person seit ...','我认识这个人已经……','介绍认识时间。'],['Was ich an dieser Person besonders schätze, ist ...','我尤其欣赏这个人的地方是……','人物题核心评价。'],['Diese Person hat mich stark beeinflusst, weil ...','这个人对我影响很大，因为……','解释影响。'],['Deshalb bedeutet diese Person sehr viel für mich.','所以这个人对我来说非常重要。','人物题结尾。'],['Ich schlage vor, dass wir ...','我建议我们……','Teil 3 共同制定计划。'],['Was hältst du davon, wenn wir ...?','你觉得我们……怎么样？','提出建议。'],['Das klingt gut. Ich bin dafür.','听起来不错。我赞成。','接受建议。'],['Ich sehe das etwas anders, weil ...','我的看法有点不同，因为……','委婉表达不同意见。'],['Da stimme ich dir zu.','我同意你的看法。','表示赞同。'],['Das finde ich auch sinnvoll.','我也觉得这样很合理。','支持对方方案。'],['Wir könnten auch ...','我们也可以……','补充方案。'],['Dann einigen wir uns darauf, dass ...','那么我们就约定……','达成一致。'],['Wer übernimmt welchen Teil?','谁负责哪一部分？','分配任务。'],['Wann und wo wollen wir uns treffen?','我们什么时候、在哪里见面？','确定时间地点。'],['Dann machen wir es so.','那我们就这么办。','计划最后确认。']];
const starter={words:[{de:'sich entscheiden',type:'Verb',zh:'决定',ex:'Ich habe mich für Deutschland entschieden.'},{de:'die Erfahrung',type:'Nomen',zh:'经历；经验',ex:'Das war eine wichtige Erfahrung für mich.'},{de:'zuverlässig',type:'Adjektiv',zh:'可靠的',ex:'Er ist sehr zuverlässig.'}],sentences:examSentences.map(x=>({de:x[0],zh:x[1],note:x[2]})),verbs:[{inf:'sein',meaning:'是',forms:['ich bin','du bist','er/sie/es ist','wir sind','ihr seid','sie/Sie sind']},{inf:'haben',meaning:'有',forms:['ich habe','du hast','er/sie/es hat','wir haben','ihr habt','sie/Sie haben']}]};let data=JSON.parse(localStorage.getItem(key)||'null')||starter,current=0,examIndex=0,examShown=false,examScore=0;let voices=[];
function loadVoices(){voices=window.speechSynthesis?window.speechSynthesis.getVoices():[]}if('speechSynthesis'in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}
function save(){localStorage.setItem(key,JSON.stringify(data))}function show(id,btn){document.querySelectorAll('section').forEach(x=>x.hidden=true);document.getElementById(id).hidden=false;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}function render(){renderReview();renderWords();renderSentences();renderVerbs();renderComplaint()}
function renderReview(){let w=data.words[current%Math.max(data.words.length,1)];document.getElementById('review').innerHTML=`<div class="meta">今日复习 · 单词</div><div class="word">${w.de}</div><div class="meta">${w.type}</div><div class="meaning">${w.zh}</div><div class="example">${w.ex}</div><div class="actions"><button class="secondary speakbtn" onclick="speakText('${esc(w.de)}')">🔊 听发音</button><button class="primary" onclick="nextCard()">下一个 →</button></div><div class="example exam"><h2>🎤 口语考试模式</h2><p>先看中文，自己说德语；说完再点「显示答案」。</p><div class="meaning" id="examPrompt"></div><div id="examAnswer" class="answer hidden"></div><div class="actions"><button class="primary" onclick="startExam()">开始/下一题</button><button class="secondary" onclick="toggleAnswer()">显示答案</button><button class="secondary speakbtn" onclick="speakExam()">🔊 听答案</button><button class="secondary" onclick="markExam(true)">✅ 会了</button><button class="secondary" onclick="markExam(false)">❌ 不会</button></div><div class="stats">本轮得分：${examScore}</div></div><div class="stats">词汇 ${data.words.length} · 句子 ${data.sentences.length} · 动词 ${data.verbs.length}</div>`;updateExamUI()}
function updateExamUI(){let p=document.getElementById('examPrompt'),a=document.getElementById('examAnswer');if(!p)return;p.textContent=examShown?examSentences[examIndex][1]:'点击「开始/下一题」开始';a.textContent=examShown?examSentences[examIndex][0]:'';a.classList.toggle('hidden',!examShown)}function startExam(){examIndex=Math.floor(Math.random()*examSentences.length);examShown=true;renderReview()}function toggleAnswer(){if(examShown)document.getElementById('examAnswer').classList.toggle('hidden')}function speakExam(){if(examShown)speakText(examSentences[examIndex][0])}function markExam(ok){if(!examShown)return;if(ok)examScore++;startExam()}function nextCard(){current=(current+1)%Math.max(data.words.length,1);renderReview()}
function renderWords(){document.getElementById('words').innerHTML=`<h2>单词库</h2><div class="grid"><div><label>德语</label><input id="wd" placeholder="z.B. vermeiden"></div><div><label>中文</label><input id="wz" placeholder="避免"></div><div><label>词性</label><input id="wt" placeholder="Verb / Nomen / Adjektiv"></div></div><label>例句</label><input id="we" placeholder="Ich versuche, ..."><button class="primary" onclick="addWord()">＋ 添加单词</button><hr>${data.words.map((w,i)=>`<div class="example"><b>${w.de}</b> — ${w.zh}<br><span class="meta">${w.ex}</span><div class="actions"><button class="speakbtn" onclick="speakText('${esc(w.de)}')">🔊 单词</button><button class="speakbtn" onclick="speakText('${esc(w.ex)}')">🔊 例句</button><button onclick="removeWord(${i})">删除</button></div></div>`).join('')}`}function addWord(){let de=wd.value.trim(),zh=wz.value.trim();if(!de||!zh)return;data.words.push({de,zh,type:wt.value.trim()||'—',ex:we.value.trim()||'—'});save();render()}function removeWord(i){data.words.splice(i,1);save();render()}
function renderSentences(){document.getElementById('sentences').innerHTML=`<h2>句子库</h2><div class="example"><b>🔥 明天口语 · 固定句型</b><br><span class="meta">Teil 1 人物/经验 + Teil 3 计划讨论。</span></div><label>德语句子</label><textarea id="sd" rows="2" placeholder="Ich bin der Meinung, dass ..."></textarea><label>中文意思</label><input id="sz" placeholder="我认为……"><label>备注</label><input id="sn" placeholder="什么时候用？固定搭配？"><button class="primary" onclick="addSentence()">＋ 添加句子</button><hr>${data.sentences.map((s,i)=>`<div class="example">${s.note&&s.note.includes('Teil')?'<span class="tag">口语考试</span><br>':''}<b>${s.de}</b><br>${s.zh}<br><span class="meta">${s.note||''}</span><div class="actions"><button class="speakbtn" onclick="speakText('${esc(s.de)}')">🔊 听句子</button><button onclick="removeSentence(${i})">删除</button></div></div>`).join('')}`}function addSentence(){let de=sd.value.trim(),zh=sz.value.trim();if(!de||!zh)return;data.sentences.push({de,zh,note:sn.value.trim()});save();render()}function removeSentence(i){data.sentences.splice(i,1);save();render()}
function renderVerbs(){document.getElementById('verbs').innerHTML=`<h2>动词变位</h2><label>原形</label><input id="vi" placeholder="gehen"><label>中文</label><input id="vz" placeholder="去"><div class="grid"><input id="v1" placeholder="ich ..."><input id="v2" placeholder="du ..."><input id="v3" placeholder="er/sie/es ..."><input id="v4" placeholder="wir ..."><input id="v5" placeholder="ihr ..."><input id="v6" placeholder="sie/Sie ..."></div><button class="primary" onclick="addVerb()">＋ 添加变位</button><hr>${data.verbs.map((v,i)=>`<div class="example"><b>${v.inf}</b> — ${v.meaning}<table>${v.forms.map((f,j)=>`<tr><td>${['ich','du','er/sie/es','wir','ihr','sie/Sie'][j]}</td><td>${f}</td><td><button class="speakbtn" onclick="speakText('${esc(f)}')">🔊</button></td></tr>`).join('')}</table><button onclick="removeVerb(${i})">删除</button></div>`).join('')}`}function addVerb(){let inf=vi.value.trim(),meaning=vz.value.trim(),forms=[v1,v2,v3,v4,v5,v6].map(x=>x.value.trim());if(!inf||!meaning||forms.some(x=>!x))return;data.verbs.push({inf,meaning,forms});save();render()}function removeVerb(i){data.verbs.splice(i,1);save();render()}
const complaintSections=[['① Betreff + Anrede',[['Betreff: Beschwerde über ...','主题：投诉关于……'],['Sehr geehrte Damen und Herren,','']]],['② Einleitung · Anlass der Beschwerde',[['Ich wende mich an Sie, weil/da/denn ...','我联系您是因为……'],['Bedauerlicherweise / Mit Bedauern / Leider muss ich mich über ... beschweren.','很遗憾，我不得不投诉……'],['Mit diesem Schreiben möchte ich Sie über die Unannehmlichkeiten informieren, ...','通过这封信，我想向您说明所遇到的不便……'],['Ich habe bei Ihnen am ... erworben / gebucht / online über Ihre Webseite bestellt, jedoch / allerdings / aber ...','我于……在贵处购买/预订/通过网站订购了……，然而……'],['Nachdem ich ..., ...','在我……之后，……']]],['③ Beschreibung des Problems',[['Zu meinem Bedauern musste ich feststellen, dass ...','遗憾的是，我不得不发现……'],['Entgegen Ihrer Beschreibung / Werbung war ...','与您的描述/广告相反，……'],['Obwohl in der Anzeige stand, dass ...','尽管广告中写着……'],['Zwar stand in der Anzeige, dass ..., aber ...','广告中虽然写着……，但是……'],['Das Produkt / die Dienstleistung entsprach nicht meinen Erwartungen, da/weil/denn ...','产品/服务没有达到我的预期，因为……'],['Besonders enttäuschend war, dass ...','尤其令人失望的是……']]],['④ Ausdruck von Enttäuschung / Kritik',[['Ich bin sehr enttäuscht / frustriert / verärgert über ...','我对……非常失望/沮丧/生气。'],['So etwas hatte ich nicht erwartet.','我没想到会发生这样的事情。'],['Das finde ich sehr ärgerlich / unzumutbar / unprofessionell / nicht akzeptabel.','我认为这非常令人恼火/无法接受/不专业/不可接受。'],['Unter diesen Umständen sehe ich mich gezwungen, ...','在这种情况下，我不得不……']]],['⑤ Forderungen / Wünsche',[['Ich erwarte eine Rückerstattung / einen Umtausch / eine Nachbesserung.','我要求退款/换货/修复。'],['Eine Rückerstattung / einen Umtausch / eine Nachbesserung halte ich in diesem Falle / aufgrund der oben genannten Gründe für angemessen.','基于上述理由，我认为退款/换货/修复在这种情况下是合理的。'],['Bitte senden Sie mir ...','请给我寄送……'],['Ich bitte Sie um eine schriftliche Stellungnahme bis zum ...','请您在……之前给我一份书面回复/说明。'],['Ich hoffe, dass Sie mir entgegenkommen und ...','希望您能够体谅并……'],['Sollte ich keine Reaktion bis ... erhalten, sehe ich mich veranlasst, die Verbraucherzentrale zu informieren / einen kritischen Kommentar auf Ihrer Homepage zu verfassen bzw. zu hinterlassen.','如果截至……我仍未收到回复，我将不得不联系消费者中心/在您的主页留下批评性评论。']]],['⑥ Schlussformeln',[['Ich danke Ihnen im Voraus für Ihre Mühe.','提前感谢您的努力。'],['Für eine zeitnahe Rückmeldung wäre ich Ihnen sehr dankbar.','如果您能尽快回复，我将非常感谢。'],['Mit freundlichen Grüßen','']]]];
function renderComplaint(){let el=document.getElementById('complaint');el.innerHTML='<h2>Beschwerdebrief · B2 📝</h2><p class="meta">TELC B2 Schreiben · 老师给的投诉信 Redemittel</p>'+complaintSections.map(s=>`<div class="example"><h3>${s[0]}</h3>${s[1].map(x=>`<div class="item"><div class="de">${x[0]}</div>${x[1]?`<div class="zh">${x[1]}</div>`:''}<div class="actions"><button class="speakbtn" onclick="speakText('${esc(x[0])}')">🔊 听句子</button></div></div>`).join('')}</div>`).join('')+'<div class="example"><h3>🔥 考试最值得背的骨架</h3><div class="item"><div class="de">Ich wende mich an Sie, weil ...<br>Zu meinem Bedauern musste ich feststellen, dass ...<br>Besonders enttäuschend war, dass ...<br>Unter diesen Umständen sehe ich mich gezwungen, ...<br>Ich erwarte eine Rückerstattung / einen Umtausch / eine Nachbesserung.<br>Ich bitte Sie um eine schriftliche Stellungnahme bis zum ...<br>Für eine zeitnahe Rückmeldung wäre ich Ihnen sehr dankbar.</div></div></div>'}
function speakText(text){if(!('speechSynthesis'in window)){alert('你的浏览器不支持语音朗读');return}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang='de-DE';u.rate=.88;u.pitch=1;u.volume=1;let de=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));if(de)u.voice=de;u.onerror=()=>alert('语音播放失败。请检查手机静音/音量，并确认 Safari 允许网页播放声音。');window.speechSynthesis.speak(u)}catch(e){alert('语音播放失败：'+e.message)}}function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}render();</script></body></html>
