<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Deutsch Lernstudio 🐱</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#222}.app{max-width:900px;margin:auto;padding:28px 18px 60px}h1{margin-bottom:6px}.sub,.meta{color:#777}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 18px}button{border:0;border-radius:12px;padding:10px 15px;cursor:pointer;font-size:15px}.tab{background:#e8e9ef}.tab.active,.primary{background:#222;color:white}.card{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.word{font-size:36px;font-weight:700;margin:8px 0}.meaning{font-size:20px;margin:18px 0}.example{background:#f4f5f8;border-radius:14px;padding:14px;margin-top:14px}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.secondary{background:#e9edf7}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;margin:6px 0 12px}label{font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.stats{margin-top:14px;color:#666}.tag{display:inline-block;background:#eee;padding:4px 8px;border-radius:8px;font-size:12px;margin-bottom:8px}</style></head>
<body><div class="app"><h1>Deutsch Lernstudio 🐱</h1><p class="sub">单词 · 句子 · 动词变位 · TELC 口语</p><div class="tabs"><button class="tab active" onclick="show('review',this)">复习</button><button class="tab" onclick="show('words',this)">单词</button><button class="tab" onclick="show('sentences',this)">句子</button><button class="tab" onclick="show('verbs',this)">变位</button></div><section id="review" class="card"></section><section id="words" class="card" hidden></section><section id="sentences" class="card" hidden></section><section id="verbs" class="card" hidden></section></div>
<script>
const key='miaomiao-deutsch-data-v1';
const examSentences=[
{de:'Ich möchte kurz über ... sprechen.',zh:'我想简单谈谈……',note:'Teil 1 开始介绍主题。'},
{de:'Ich habe mich für dieses Thema entschieden, weil ...',zh:'我选择这个主题是因为……',note:'介绍为什么选择这个经验/人物。'},
{de:'Das war für mich eine besondere Erfahrung, weil ...',zh:'这对我来说是一次特别的经历，因为……',note:'经验题万能句。'},
{de:'Besonders gut gefallen hat mir, dass ...',zh:'我尤其喜欢的是……',note:'描述积极感受。'},
{de:'Was ich daran besonders interessant fand, war ...',zh:'我觉得其中特别有意思的是……',note:'展开细节。'},
{de:'Wenn ich mich richtig erinnere, ...',zh:'如果我没记错的话……',note:'不确定细节时使用。'},
{de:'Insgesamt war das eine Erfahrung, die ich nicht vergessen werde.',zh:'总的来说，这是一次我不会忘记的经历。',note:'经验题结尾。'},
{de:'Eine Person, die mir besonders wichtig ist, ist ...',zh:'一个对我特别重要的人是……',note:'Teil 1 人物题开头。'},
{de:'Ich kenne diese Person seit ...',zh:'我认识这个人已经……',note:'介绍认识时间。'},
{de:'Was ich an dieser Person besonders schätze, ist ...',zh:'我尤其欣赏这个人的地方是……',note:'人物题核心评价。'},
{de:'Diese Person hat mich stark beeinflusst, weil ...',zh:'这个人对我影响很大，因为……',note:'解释影响。'},
{de:'Deshalb bedeutet diese Person sehr viel für mich.',zh:'所以这个人对我来说非常重要。',note:'人物题结尾。'},
{de:'Ich schlage vor, dass wir ...',zh:'我建议我们……',note:'Teil 3 共同制定计划。'},
{de:'Was hältst du davon, wenn wir ...?',zh:'你觉得我们……怎么样？',note:'提出建议。'},
{de:'Das klingt gut. Ich bin dafür.',zh:'听起来不错。我赞成。',note:'接受建议。'},
{de:'Ich sehe das etwas anders, weil ...',zh:'我的看法有点不同，因为……',note:'委婉表达不同意见。'},
{de:'Da stimme ich dir zu.',zh:'我同意你的看法。',note:'表示赞同。'},
{de:'Das finde ich auch sinnvoll.',zh:'我也觉得这样很合理。',note:'支持对方方案。'},
{de:'Wir könnten auch ...',zh:'我们也可以……',note:'补充方案。'},
{de:'Dann einigen wir uns darauf, dass ...',zh:'那么我们就约定……',note:'达成一致。'},
{de:'Wer übernimmt welchen Teil?',zh:'谁负责哪一部分？',note:'分配任务。'},
{de:'Wann und wo wollen wir uns treffen?',zh:'我们什么时候、在哪里见面？',note:'确定时间地点。'},
{de:'Dann machen wir es so.',zh:'那我们就这么办。',note:'计划最后确认。'}
];
const starter={words:[{de:'sich entscheiden',type:'Verb',zh:'决定',ex:'Ich habe mich für Deutschland entschieden.'},{de:'die Erfahrung',type:'Nomen',zh:'经历；经验',ex:'Das war eine wichtige Erfahrung für mich.'},{de:'zuverlässig',type:'Adjektiv',zh:'可靠的',ex:'Er ist sehr zuverlässig.'}],sentences:examSentences.map(x=>({...x})),verbs:[{inf:'sein',meaning:'是',forms:['ich bin','du bist','er/sie/es ist','wir sind','ihr seid','sie/Sie sind']},{inf:'haben',meaning:'有',forms:['ich habe','du hast','er/sie/es hat','wir haben','ihr habt','sie/Sie haben']}]};
let data=JSON.parse(localStorage.getItem(key)||'null')||starter,current=0;
function save(){localStorage.setItem(key,JSON.stringify(data))}function show(id,btn){document.querySelectorAll('section').forEach(x=>x.hidden=true);document.getElementById(id).hidden=false;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}function render(){renderReview();renderWords();renderSentences();renderVerbs()}
function renderReview(){const w=data.words[current%Math.max(data.words.length,1)];document.getElementById('review').innerHTML=`<div class="meta">今日复习 · 单词</div><div class="word">${w.de}</div><div class="meta">${w.type}</div><div class="meaning">${w.zh}</div><div class="example">${w.ex}</div><div class="actions"><button class="secondary" onclick="speak('${esc(w.de)}')">🔊 听发音</button><button class="primary" onclick="nextCard()">下一个 →</button></div><div class="stats">词汇 ${data.words.length} · 句子 ${data.sentences.length} · 动词 ${data.verbs.length}</div>`}function nextCard(){current=(current+1)%Math.max(data.words.length,1);renderReview()}
function renderWords(){document.getElementById('words').innerHTML=`<h2>单词库</h2><div class="grid"><div><label>德语</label><input id="wd" placeholder="z.B. vermeiden"></div><div><label>中文</label><input id="wz" placeholder="避免"></div><div><label>词性</label><input id="wt" placeholder="Verb / Nomen / Adjektiv"></div></div><label>例句</label><input id="we" placeholder="Ich versuche, ..."><button class="primary" onclick="addWord()">＋ 添加单词</button><hr>${data.words.map((w,i)=>`<div class="example"><b>${w.de}</b> — ${w.zh}<br><span class="meta">${w.ex}</span> <button onclick="removeWord(${i})">删除</button></div>`).join('')}`}function addWord(){let de=wd.value.trim(),zh=wz.value.trim();if(!de||!zh)return;data.words.push({de,zh,type:wt.value.trim()||'—',ex:we.value.trim()||'—'});save();render()}function removeWord(i){data.words.splice(i,1);save();render()}
function renderSentences(){document.getElementById('sentences').innerHTML=`<h2>句子库</h2><div class="example"><b>🔥 明天口语 · 固定句型</b><br><span class="meta">这些是为你准备的 Teil 1 人物/经验 + Teil 3 计划讨论句型。</span></div><label>德语句子</label><textarea id="sd" rows="2" placeholder="Ich bin der Meinung, dass ..."></textarea><label>中文意思</label><input id="sz" placeholder="我认为……"><label>备注</label><input id="sn" placeholder="什么时候用？固定搭配？"><button class="primary" onclick="addSentence()">＋ 添加句子</button><hr>${data.sentences.map((s,i)=>`<div class="example">${s.note&&s.note.includes('Teil')?'<span class="tag">口语考试</span><br>':''}<b>${s.de}</b><br>${s.zh}<br><span class="meta">${s.note||''}</span> <button onclick="speak('${esc(s.de)}')">🔊</button> <button onclick="removeSentence(${i})">删除</button></div>`).join('')}`}function addSentence(){let de=sd.value.trim(),zh=sz.value.trim();if(!de||!zh)return;data.sentences.push({de,zh,note:sn.value.trim()});save();render()}function removeSentence(i){data.sentences.splice(i,1);save();render()}
function renderVerbs(){document.getElementById('verbs').innerHTML=`<h2>动词变位</h2><label>原形</label><input id="vi" placeholder="gehen"><label>中文</label><input id="vz" placeholder="去"><div class="grid"><input id="v1" placeholder="ich ..."><input id="v2" placeholder="du ..."><input id="v3" placeholder="er/sie/es ..."><input id="v4" placeholder="wir ..."><input id="v5" placeholder="ihr ..."><input id="v6" placeholder="sie/Sie ..."></div><button class="primary" onclick="addVerb()">＋ 添加变位</button><hr>${data.verbs.map((v,i)=>`<div class="example"><b>${v.inf}</b> — ${v.meaning}<table>${v.forms.map((f,j)=>`<tr><td>${['ich','du','er/sie/es','wir','ihr','sie/Sie'][j]}</td><td>${f}</td></tr>`).join('')}</table><button onclick="removeVerb(${i})">删除</button></div>`).join('')}`}function addVerb(){let inf=vi.value.trim(),meaning=vz.value.trim(),forms=[v1,v2,v3,v4,v5,v6].map(x=>x.value.trim());if(!inf||!meaning||forms.some(x=>!x))return;data.verbs.push({inf,meaning,forms});save();render()}function removeVerb(i){data.verbs.splice(i,1);save();render()}function speak(text){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(text);u.lang='de-DE';speechSynthesis.speak(u)}}function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}render();
</script></body></html>
