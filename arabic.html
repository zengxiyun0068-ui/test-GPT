<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Deutsch Lernstudio · العربية</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#222}.app{max-width:900px;margin:auto;padding:28px 18px 60px}h1{margin-bottom:6px}.sub,.meta{color:#777}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 18px}.tab,button{border:0;border-radius:12px;padding:10px 15px;cursor:pointer;font-size:15px}.tab{background:#e8e9ef}.tab.active,.primary{background:#222;color:white}.card{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.word{font-size:36px;font-weight:700;margin:8px 0}.meaning{font-size:20px;margin:18px 0}.example{background:#f4f5f8;border-radius:14px;padding:14px;margin-top:14px}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;margin:6px 0 12px}label{font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}.stats{margin-top:14px;color:#666}.tag{display:inline-block;background:#eee;padding:4px 8px;border-radius:8px;font-size:12px;margin-bottom:8px}.answer{font-size:21px;font-weight:600;margin:14px 0}.hidden{display:none}.exam{border:2px solid #eee}.speakbtn{background:#e8f0ff}.item{background:#f4f5f8;border-radius:14px;padding:15px;margin:10px 0}.de{font-weight:650;font-size:17px;direction:ltr;text-align:left}.zh{color:#666;margin-top:6px}.ar{margin-top:6px}</style></head><body><div class="app"><h1>Deutsch Lernstudio 🐱</h1><p class="sub">الكلمات · الجمل · تصريف الأفعال · المحادثة TELC · رسالة الشكوى</p><div class="tabs"><button class="tab active" onclick="show('review',this)">المراجعة</button><button class="tab" onclick="show('words',this)">الكلمات</button><button class="tab" onclick="show('sentences',this)">الجمل</button><button class="tab" onclick="show('verbs',this)">تصريف الأفعال</button><button class="tab" onclick="show('complaint',this)">📝 رسالة شكوى B2</button></div><section id="review" class="card"></section><section id="words" class="card" hidden></section><section id="sentences" class="card" hidden></section><section id="verbs" class="card" hidden></section><section id="complaint" class="card" hidden></section></div><script>
const key='jana-arabic-deutsch-v1';
const examSentences=[['Ich möchte kurz über ... sprechen.','أود أن أتحدث باختصار عن ...','Teil 1: بداية الحديث عن الموضوع.'],['Ich habe mich für dieses Thema entschieden, weil ...','اخترت هذا الموضوع لأن ...','شرح سبب اختيار التجربة أو الشخص.'],['Das war für mich eine besondere Erfahrung, weil ...','كانت هذه تجربة مميزة بالنسبة لي لأن ...','جملة مفيدة عن تجربة.'],['Besonders gut gefallen hat mir, dass ...','أعجبني بشكل خاص أن ...','التعبير عن شيء إيجابي.'],['Was ich daran besonders interessant fand, war ...','ما وجدته ممتعًا بشكل خاص هو ...','إضافة تفاصيل.'],['Wenn ich mich richtig erinnere, ...','إذا كنت أتذكر بشكل صحيح، ...','عند عدم التأكد من التفاصيل.'],['Insgesamt war das eine Erfahrung, die ich nicht vergessen werde.','بشكل عام، كانت هذه تجربة لن أنساها.','خاتمة موضوع التجربة.'],['Eine Person, die mir besonders wichtig ist, ist ...','شخص مهم جدًا بالنسبة لي هو ...','Teil 1: بداية موضوع الشخص.'],['Ich kenne diese Person seit ...','أعرف هذا الشخص منذ ...','ذكر مدة المعرفة.'],['Was ich an dieser Person besonders schätze, ist ...','أقدّر بشكل خاص في هذا الشخص ...','تقييم الشخص.'],['Diese Person hat mich stark beeinflusst, weil ...','أثر هذا الشخص فيّ كثيرًا لأن ...','شرح التأثير.'],['Deshalb bedeutet diese Person sehr viel für mich.','لذلك يعني هذا الشخص الكثير بالنسبة لي.','خاتمة موضوع الشخص.'],['Ich schlage vor, dass wir ...','أقترح أن نقوم بـ ...','Teil 3: تقديم اقتراح.'],['Was hältst du davon, wenn wir ...?','ما رأيك أن نقوم بـ ...؟','اقتراح بطريقة ودية.'],['Das klingt gut. Ich bin dafür.','هذا يبدو جيدًا. أنا موافق/ة.','قبول اقتراح.'],['Ich sehe das etwas anders, weil ...','أرى الأمر بشكل مختلف قليلًا لأن ...','التعبير عن اختلاف الرأي بلطف.'],['Da stimme ich dir zu.','أتفق معك في ذلك.','الموافقة.'],['Das finde ich auch sinnvoll.','أرى ذلك منطقيًا أيضًا.','دعم اقتراح الطرف الآخر.'],['Wir könnten auch ...','يمكننا أيضًا أن ...','إضافة اقتراح.'],['Dann einigen wir uns darauf, dass ...','إذن نتفق على أن ...','الوصول إلى اتفاق.'],['Wer übernimmt welchen Teil?','من سيتولى أي جزء؟','تقسيم المهام.'],['Wann und wo wollen wir uns treffen?','متى وأين نريد أن نلتقي؟','تحديد الوقت والمكان.'],['Dann machen wir es so.','إذن سنفعل ذلك بهذه الطريقة.','تأكيد الخطة.']];
const starter={words:[{de:'sich entscheiden',type:'Verb',zh:'يقرر',ex:'Ich habe mich für Deutschland entschieden.'},{de:'die Erfahrung',type:'Nomen',zh:'التجربة؛ الخبرة',ex:'Das war eine wichtige Erfahrung für mich.'},{de:'zuverlässig',type:'Adjektiv',zh:'موثوق / يعتمد عليه',ex:'Er ist sehr zuverlässig.'}],sentences:examSentences.map(x=>({de:x[0],zh:x[1],note:x[2]})),verbs:[{inf:'sein',meaning:'يكون',forms:['ich bin','du bist','er/sie/es ist','wir sind','ihr seid','sie/Sie sind']},{inf:'haben',meaning:'يمتلك / لديه',forms:['ich habe','du hast','er/sie/es hat','wir haben','ihr habt','sie/Sie haben']}]};let data=JSON.parse(localStorage.getItem(key)||'null')||starter,current=0,examIndex=0,examShown=false,examScore=0;let voices=[];function loadVoices(){voices=window.speechSynthesis?window.speechSynthesis.getVoices():[]}if('speechSynthesis'in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}function save(){localStorage.setItem(key,JSON.stringify(data))}function show(id,btn){document.querySelectorAll('section').forEach(x=>x.hidden=true);document.getElementById(id).hidden=false;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}function render(){renderReview();renderWords();renderSentences();renderVerbs();renderComplaint()}
function renderReview(){let w=data.words[current%Math.max(data.words.length,1)];document.getElementById('review').innerHTML=`<div class="meta">مراجعة اليوم · كلمة</div><div class="word" dir="ltr">${w.de}</div><div class="meta">${w.type}</div><div class="meaning">${w.zh}</div><div class="example" dir="ltr">${w.ex}</div><div class="actions"><button class="speakbtn" onclick="speakText('${esc(w.de)}')">🔊 النطق</button><button class="primary" onclick="nextCard()">التالي →</button></div><div class="example exam"><h2>🎤 وضع امتحان المحادثة</h2><p>اقرأ المعنى العربي، قل الجملة بالألمانية بنفسك، ثم اعرض الإجابة.</p><div class="meaning" id="examPrompt"></div><div id="examAnswer" class="answer hidden" dir="ltr"></div><div class="actions"><button class="primary" onclick="startExam()">ابدأ / السؤال التالي</button><button onclick="toggleAnswer()">إظهار الإجابة</button><button class="speakbtn" onclick="speakExam()">🔊 سماع الإجابة</button><button onclick="markExam(true)">✅ أعرفها</button><button onclick="markExam(false)">❌ لا أعرفها</button></div><div class="stats">النتيجة الحالية: ${examScore}</div></div><div class="stats">الكلمات ${data.words.length} · الجمل ${data.sentences.length} · الأفعال ${data.verbs.length}</div>`;updateExamUI()}
function updateExamUI(){let p=document.getElementById('examPrompt'),a=document.getElementById('examAnswer');if(!p)return;p.textContent=examShown?examSentences[examIndex][1]:'اضغط «ابدأ / السؤال التالي» للبدء';a.textContent=examShown?examSentences[examIndex][0]:'';a.classList.toggle('hidden',!examShown)}function startExam(){examIndex=Math.floor(Math.random()*examSentences.length);examShown=true;renderReview()}function toggleAnswer(){if(examShown)document.getElementById('examAnswer').classList.toggle('hidden')}function speakExam(){if(examShown)speakText(examSentences[examIndex][0])}function markExam(ok){if(!examShown)return;if(ok)examScore++;startExam()}function nextCard(){current=(current+1)%Math.max(data.words.length,1);renderReview()}
function renderWords(){document.getElementById('words').innerHTML=`<h2>مفردات</h2><div class="grid"><div><label>الألمانية</label><input id="wd" placeholder="z.B. vermeiden"></div><div><label>المعنى بالعربية</label><input id="wz" placeholder="يتجنب"></div><div><label>نوع الكلمة</label><input id="wt" placeholder="Verb / Nomen / Adjektiv"></div></div><label>مثال</label><input id="we" placeholder="Ich versuche, ..."><button class="primary" onclick="addWord()">＋ إضافة كلمة</button><hr>${data.words.map((w,i)=>`<div class="example"><b dir="ltr">${w.de}</b> — ${w.zh}<br><span class="meta" dir="ltr">${w.ex}</span><div class="actions"><button class="speakbtn" onclick="speakText('${esc(w.de)}')">🔊 الكلمة</button><button class="speakbtn" onclick="speakText('${esc(w.ex)}')">🔊 المثال</button><button onclick="removeWord(${i})">حذف</button></div></div>`).join('')}`}function addWord(){let de=wd.value.trim(),zh=wz.value.trim();if(!de||!zh)return;data.words.push({de,zh,type:wt.value.trim()||'—',ex:we.value.trim()||'—'});save();render()}function removeWord(i){data.words.splice(i,1);save();render()}
function renderSentences(){document.getElementById('sentences').innerHTML=`<h2>الجمل</h2><div class="example"><b>🔥 جمل المحادثة للامتحان</b><br><span class="meta">Teil 1: الشخص/التجربة + Teil 3: التخطيط والمناقشة.</span></div><label>الجملة بالألمانية</label><textarea id="sd" rows="2" placeholder="Ich bin der Meinung, dass ..."></textarea><label>المعنى بالعربية</label><input id="sz" placeholder="أعتقد أن ..."><label>ملاحظات</label><input id="sn" placeholder="متى تستخدمها؟"><button class="primary" onclick="addSentence()">＋ إضافة جملة</button><hr>${data.sentences.map((s,i)=>`<div class="example">${s.note&&s.note.includes('Teil')?'<span class="tag">امتحان المحادثة</span><br>':''}<b dir="ltr">${s.de}</b><br>${s.zh}<br><span class="meta">${s.note||''}</span><div class="actions"><button class="speakbtn" onclick="speakText('${esc(s.de)}')">🔊 سماع الجملة</button><button onclick="removeSentence(${i})">حذف</button></div></div>`).join('')}`}function addSentence(){let de=sd.value.trim(),zh=sz.value.trim();if(!de||!zh)return;data.sentences.push({de,zh,note:sn.value.trim()});save();render()}function removeSentence(i){data.sentences.splice(i,1);save();render()}
function renderVerbs(){document.getElementById('verbs').innerHTML=`<h2>تصريف الأفعال</h2><label>المصدر</label><input id="vi" placeholder="gehen"><label>المعنى بالعربية</label><input id="vz" placeholder="يذهب"><div class="grid"><input id="v1" placeholder="ich ..."><input id="v2" placeholder="du ..."><input id="v3" placeholder="er/sie/es ..."><input id="v4" placeholder="wir ..."><input id="v5" placeholder="ihr ..."><input id="v6" placeholder="sie/Sie ..."></div><button class="primary" onclick="addVerb()">＋ إضافة فعل</button><hr>${data.verbs.map((v,i)=>`<div class="example"><b dir="ltr">${v.inf}</b> — ${v.meaning}<table>${v.forms.map((f,j)=>`<tr><td>${['ich','du','er/sie/es','wir','ihr','sie/Sie'][j]}</td><td dir="ltr">${f}</td><td><button class="speakbtn" onclick="speakText('${esc(f)}')">🔊</button></td></tr>`).join('')}</table><button onclick="removeVerb(${i})">حذف</button></div>`).join('')}`}function addVerb(){let inf=vi.value.trim(),meaning=vz.value.trim(),forms=[v1,v2,v3,v4,v5,v6].map(x=>x.value.trim());if(!inf||!meaning||forms.some(x=>!x))return;data.verbs.push({inf,meaning,forms});save();render()}function removeVerb(i){data.verbs.splice(i,1);save();render()}
function renderComplaint(){const c=[['① الموضوع والتحية','Betreff: Beschwerde über ...','الموضوع: شكوى بشأن ...','Sehr geehrte Damen und Herren,','السيدات والسادة المحترمون،'],['② المقدمة · سبب الشكوى','Ich wende mich an Sie, weil/da/denn ...','أتواصل معكم لأن ...','Bedauerlicherweise / Mit Bedauern / Leider muss ich mich über ... beschweren.','للأسف، أضطر إلى تقديم شكوى بشأن ...','Mit diesem Schreiben möchte ich Sie über die Unannehmlichkeiten informieren, ...','أود من خلال هذه الرسالة إبلاغكم بالمشكلات والإزعاج الذي واجهته ...','Ich habe bei Ihnen am ... erworben / gebucht / online über Ihre Webseite bestellt, jedoch / allerdings / aber ...','اشتريت / حجزت / طلبت عبر موقعكم بتاريخ ...، ولكن ...','Nachdem ich ..., ...','بعد أن ...، ...'],['③ وصف المشكلة','Zu meinem Bedauern musste ich feststellen, dass ...','للأسف، اضطررت إلى ملاحظة أن ...','Entgegen Ihrer Beschreibung / Werbung war ...','على خلاف الوصف / الإعلان الخاص بكم، كان ...','Obwohl in der Anzeige stand, dass ...','رغم أن الإعلان ذكر أن ...','Zwar stand in der Anzeige, dass ..., aber ...','صحيح أن الإعلان ذكر أن ...، ولكن ...','Das Produkt / die Dienstleistung entsprach nicht meinen Erwartungen, da/weil/denn ...','المنتج / الخدمة لم يلبِّ توقعاتي لأن ...','Besonders enttäuschend war, dass ...','كان الأمر الأكثر إحباطًا هو أن ...'],['④ التعبير عن خيبة الأمل والنقد','Ich bin sehr enttäuscht / frustriert / verärgert über ...','أنا محبط / مستاء / غاضب جدًا من ...','So etwas hatte ich nicht erwartet.','لم أتوقع حدوث شيء كهذا.','Das finde ich sehr ärgerlich / unzumutbar / unprofessionell / nicht akzeptabel.','أرى أن هذا مزعج جدًا / غير مقبول / غير مهني / غير مقبول إطلاقًا.','Unter diesen Umständen sehe ich mich gezwungen, ...','في هذه الظروف أجد نفسي مضطرًا إلى ...'],['⑤ المطالب والطلبات','Ich erwarte eine Rückerstattung / einen Umtausch / eine Nachbesserung.','أتوقع استرداد المال / استبدال المنتج / إصلاح المشكلة.','Eine Rückerstattung / einen Umtausch / eine Nachbesserung halte ich in diesem Falle / aufgrund der oben genannten Gründe für angemessen.','أرى أن استرداد المال / الاستبدال / الإصلاح مناسب في هذه الحالة بسبب الأسباب المذكورة أعلاه.','Bitte senden Sie mir ...','يرجى إرسال ... إليّ.','Ich bitte Sie um eine schriftliche Stellungnahme bis zum ...','أطلب منكم تقديم رد كتابي قبل تاريخ ...','Ich hoffe, dass Sie mir entgegenkommen und ...','آمل أن تتفهموا موقفي وأن ...','Sollte ich keine Reaktion bis ... erhalten, sehe ich mich veranlasst, die Verbraucherzentrale zu informieren / einen kritischen Kommentar auf Ihrer Homepage zu verfassen bzw. zu hinterlassen.','إذا لم أتلقَّ ردًا حتى ... فسأضطر إلى إبلاغ مركز حماية المستهلك / كتابة أو ترك تعليق نقدي على موقعكم.'],['⑥ الخاتمة','Ich danke Ihnen im Voraus für Ihre Mühe.','أشكركم مقدمًا على جهودكم.','Für eine zeitnahe Rückmeldung wäre ich Ihnen sehr dankbar.','سأكون ممتنًا جدًا لردكم في أقرب وقت ممكن.','Mit freundlichen Grüßen','مع خالص التحية،']];document.getElementById('complaint').innerHTML=`<h2>📝 رسالة شكوى B2 · Beschwerdebrief</h2><p class="meta">قالب Redemittel للامتحان TELC B2 · مترجم بالكامل إلى العربية</p>${c.map(g=>`<div class="card"><h3>${g[0]}</h3>${g.slice(1).reduce((html,x,i)=>i%2===0?html+`<div class="item"><div class="de">${x}</div>`:html+`<div class="ar">${x}</div></div>`, '')}</div>`).join('')}<div class="card"><h2>🔥 الهيكل الذي يستحق الحفظ للامتحان</h2><div class="item"><div class="de">Ich wende mich an Sie, weil ...</div><div class="ar">أتواصل معكم لأن ...</div></div><div class="item"><div class="de">Zu meinem Bedauern musste ich feststellen, dass ...</div><div class="ar">للأسف، اضطررت إلى ملاحظة أن ...</div></div><div class="item"><div class="de">Besonders enttäuschend war, dass ...</div><div class="ar">كان الأمر الأكثر إحباطًا هو أن ...</div></div><div class="item"><div class="de">Unter diesen Umständen sehe ich mich gezwungen, ...</div><div class="ar">في هذه الظروف أجد نفسي مضطرًا إلى ...</div></div><div class="item"><div class="de">Ich erwarte eine Rückerstattung / einen Umtausch / eine Nachbesserung.</div><div class="ar">أتوقع استرداد المال / استبدال المنتج / إصلاح المشكلة.</div></div><div class="item"><div class="de">Ich bitte Sie um eine schriftliche Stellungnahme bis zum ...</div><div class="ar">أطلب منكم تقديم رد كتابي قبل تاريخ ...</div></div><div class="item"><div class="de">Für eine zeitnahe Rückmeldung wäre ich Ihnen sehr dankbar.</div><div class="ar">سأكون ممتنًا جدًا لردكم في أقرب وقت ممكن.</div></div></div>`}
function speakText(text){if(!('speechSynthesis'in window)){alert('المتصفح لا يدعم القراءة الصوتية');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang='de-DE';u.rate=.88;u.pitch=1;let de=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));if(de)u.voice=de;window.speechSynthesis.speak(u)}function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}render();</script></body></html>
