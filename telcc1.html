h('teil2-v3.html?v=20260826-11',{cache:'no-store'})).then(r=>{if(!r.ok)throw new Error('Teil 2 加载失败 '+r.status);return r.text()}).then(html=>{const p=new DOMParser().parseFromString(html,'text/html');target.innerHTML=p.body.innerHTML;const old=target.querySelector('#q24');if(old){old.id='q25';old.classList.remove('hide')}const n=target.querySelector('.app>.card:first-child');if(!n)throw new Error('Teil 2目录不存在');n.innerHTML='<h2>Teil 2 · 题目目录</h2><button class="active">① Wege der Migration - Ein persönliches Protokoll</button><button class="sub">② Wenn Unternehmen Personal abbauen</button><button class="sub">③ Selfies</button><button class="sub">④ Bilinmeyen</button><button class="sub">⑤ Smartwatches für Kinder</button>';return fetch('teil2-bilinmeyen.html?v=20260826-11',{cache:'no-store'}).then(r=>r.text()).then(extra=>{const p2=new DOMParser().parseFromString(extra,'text/html'),fourth=p2.body.querySelector('#q24');if(fourth){fourth.id='q24';fourth.classList.add('hide');target.appendChild(fourth)}return n})}).then(n=>{const bs=n.querySelectorAll('button');d.defaultView.Q2=(x,b)=>{for(let i=1;i<=5;i++){const e=d.getElementById('q2'+i);if(e)e.classList.toggle('hide',i!==x)}bs.forEach(y=>y.classList.remove('active'));if(b)b.classList.add('active')};bs.forEach((b,i)=>b.onclick=()=>d.defaultView.Q2(i+1,b));d.defaultView.Q2(1,bs[0]);return fetch('teil3-tourismus.html?v=20260826-11',{cache:'no-store'})}).then(r=>r.text()).then(html=>{const p=new DOMParser().parseFromString(html,'text/html');t3.innerHTML=p.body.innerHTML;t3.dataset.loaded='1'}).catch(e=>{console.error(e);if(t3)t3.innerHTML='<div class="card"><h2>Teil 3</h2><p style="color:#b00">Teil 3 加载失败：'+e.message+'</p><p>请刷新页面重试。</p></div>'})}catch(e){console.error(e);setTimeout(install,100)}}frame.addEventListener('load',install);install()})();</script></body></html>
