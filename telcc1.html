<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELC C1 · Leseverstehen</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="master" src="telcc1-master.html" title="TELC C1"></iframe><script>(function(){const teil2=`<div class="card"><h2>Teil 2 · 题目目录</h2><button class="active" onclick="Q2(1,this)">① Wege der Migration - Ein persönliches Protokoll</button><button class="sub" onclick="Q2(2,this)">② Wenn Unternehmen Personal abbauen</button><button class="sub" onclick="Q2(3,this)">③ Selfies</button></div><div id="q21"><div class="card"><h2>① Wege der Migration - Ein persönliches Protokoll</h2><p><b>Leseverstehen, Teil 2</b></p><p>Lesen Sie den folgenden Text. In welchem Textabsatz a-e finden Sie die Antworten auf die Fragen 7-12. Es gibt jeweils nur eine richtige Lösung. Jeder Absatz kann Antworten auf mehrere Fragen enthalten. Markieren Sie Ihre Lösungen für die Aufgaben 7-12 auf dem Antwortbogen.</p><p><b>In welchem Abschnitt ...</b></p><p>7. Drückt der Autor Hoffnung auf eine bessere Zukunft aus?</p><p>8. Geht der Autor auf die Existenz von Vorurteilen in der Gesellschaft ein?</p><p>9. Hinterfragt der Autor den eigenen Weg?</p><p>10. Beschreibt der Autor ein Gefühl der Entfremdung in der neuen Umgebung?</p><p>11. Ruft der Autor zur Solidarität mit anderen Migrant/innen auf?</p><p>12. Kritisiert der Autor bürokratische Hürden?</p><h3>a.</h3><p>Ich sitze in meinem Glasbüro in einem Berliner Software-Startup und betrachte das geschäftige Treiben auf der Torstraße. Fast ein Jahrzehnt ist vergangen, seit ich mein Heimatland mit nichts als einem Koffer und einem exzellenten Masterabschluss in Informatik verlassen habe. Damals wiegte ich mich in der trügerischen Sicherheit, dass technisches Know-how eine universelle Währung sei, die mir sofort alle Türen öffnen würde. Doch die Realität der ersten Jahre glich eher einem Schattendasein. Ich fühlte mich wie ein Statist in einem fremdsprachigen Film, dessen Dialoge ich zwar mühsam dechiffrieren konnte, dessen kulturelle Untertöne und feine Ironie mir jedoch verschlossen blieben. Es ist eine zutiefst verstörende Erfahrung, wenn die eigene kognitive Leistungsfähigkeit vom Gegenüber unbewusst an der Perfektion der Aussprache oder der Wahl der Präpositionen gemessen wird. Diese subtile Form der Depersonalisierung in alltäglichen Gesprächen hinterlässt Spuren, die auch nach Jahren des beruflichen Erfolgs nicht gänzlich verheilen.</p><h3>b.</h3><p>Rückblickend muss ich eingestehen, dass mein anfänglicher Eifer, mich bis zur Unkenntlichkeit anzupassen, ein psychologischer Holzweg war. In dem obsessiven Bestreben, alles „typisch Deutsche" zu internalisieren und jede Spur meiner Herkunft zu tilgen, verlor ich zeitweise den Kontakt zu meinen eigenen Werten. Ich war oft unerbittlich mit mir selbst, legte eine fast schon masochistische Arbeitsdisziplin an den Tag, nur um die vermeintliche Unterlegenheit meiner migrantischen Biografie durch doppelte Leistung zu kompensieren. Heute betrachte ich diesen Perfektionsdrang als eine Form der Selbstverleugnung. Ich hätte mir damals die Freiheit zugestehen müssen, Fehler zu machen und meine Andersartigkeit nicht als Defizit, sondern als legitimen Teil meiner Identität zu begreifen. Stattdessen fungierte ich als mein eigener strengster Kontrolleur, immer auf der Hut, bloß keine Angriffsfläche für Kritik zu bieten.</p><h3>c.</h3><p>Was mich jedoch bis heute mit einer Mischung aus Zorn und Fassungslosigkeit erfüllt, ist die institutionelle Kälte, die einem in den hiesigen Amtsstuben entgegenschlägt. Man wird als dringend benötigte Hochwertfachkraft angeworben, findet sich dann aber in endlosen Warteschlangen wieder, um von Sachbearbeitern belehrt zu werden, die im Dickicht ihrer eigenen Verwaltungsvorschriften gefangen scheinen. Diese sprachlichen Barrieren, manifestiert in einem kryptischen Beamtendeutsch, wirken wie eine absichtliche Exklusionsstrategie. Es drängt sich der Verdacht auf, dass die bürokratischen Hürden nicht nur der Ordnung dienen, sondern als eine Art inoffizieller Belastungstest fungieren, der die psychische Belastbarkeit der Neuankömmlinge auf die Probe stellen soll. Die Diskrepanz zwischen der politischen Rhetorik der „Willkommenskultur" und der gelebten administrativen Realität ist ein systemisches Versagen, das wertvolle Potenziale im Keim erstickt.</p><h3>d.</h3><p>Trotz des viel beschworenen Fachkräftemangels und der Omnipräsenz des Begriffs „Diversity" in modernen Firmenbroschüren, sind die gläsernen Decken für Menschen mit Migrationshintergrund nach wie vor Realität. Es ist eine bittere Ironie, dass man zwar als „Bereicherung" gefeiert wird, solange man reibungslos funktioniert, aber sofort auf hartnäckige Stereotypen stößt, sobald man Führungsansprüche anmeldet. Oftmals werden Migranten unbewusst in bestimmte Nischen gedrängt - etwa für die Kommunikation mit schwierigen Auslandsmärkten -, während die strategischen Kernentscheidungen in einem homogenen Zirkel verbleiben. Diese unterschwellige Kategorisierung ist umso gefährlicher, da sie meist freundlich lächelnd daherkommt. Man wird für seine „interkulturelle Kompetenz" gelobt, was im Klartext oft bedeutet, dass man für die Position des klassischen Entscheidungsträgers schlicht nicht vorgesehen ist.</p><h3>e.</h3><p>Allen, die sich momentan in der kräftezehrenden Phase der ersten Ankunft befinden, möchte ich zurufen: Bewahrt euch eure Resilienz und lasst euch nicht von der Kälte der Paragrafen entmutigen. Der Weg zur gesellschaftlichen Teilhabe ist kein Sprint, sondern ein Marathon, den man nicht alleine bestreiten sollte. Wir müssen damit beginnen, belastbare Netzwerke der Solidarität zu knüpfen, in denen wir Wissen weitergeben und uns gegenseitig stützen, um die strukturellen Benachteiligungen kollektiv aufzubrechen. Trotz der unbestreitbaren Defizite im System blicke ich mit vorsichtigem Optimismus in die Zukunft. Die demografische Realität wird dieses Land unweigerlich dazu zwingen, echte Inklusion zu lernen. Unsere Präsenz ist kein Bittgang, sondern die vitale Chance für eine Gesellschaft, die ohne den Zustrom von außen ihre eigene Innovationsfähigkeit einbüßen würde. Bleibt standhaft - der Wandel ist bereits im Gange.</p><div class="tip ans">Lösungen: 7-e · 8-d · 9-b · 10-a · 11-e · 12-c</div><div class="tip"><b>🧠 题目思路</b><br>7-e：作者说“blicke ich mit vorsichtigem Optimismus in die Zukunft”并指出“der Wandel ist bereits im Gange”，明确表达对未来的希望。<br>8-d：d中直接出现“hartnäckige Stereotypen”和“unterschwellige Kategorisierung”，对应社会中的偏见与刻板印象。<br>9-b：“Rückblickend muss ich eingestehen”以及“psychologischer Holzweg”是在回顾并反思自己当初的选择。<br>10-a：“fühlte mich wie ein Statist in einem fremdsprachigen Film”以及“Depersonalisierung”明确描述在新环境中的疏离感。<br>11-e：“Wir müssen ... Netzwerke der Solidarität knüpfen”直接号召移民之间建立互助与团结网络。<br>12-c：“endlosen Warteschlangen”“Verwaltungsvorschriften”“kryptisches Beamtendeutsch”“bürokratischen Hürden”集中批评官僚程序和行政障碍。</div></div><div id="q22" class="hide"><div class="card"><h2>② Wenn Unternehmen Personal abbauen</h2><p><b>Leseverstehen, Teil 2</b></p><p>Lesen Sie den folgenden Text.In welchem Textabsatz (a-e) finden Sie die Antworten auf die Fragen 7-12?Es gibt jeweils nur eine richtige Lösung. Jeder Absatz kann Antworten auf mehrere Fragen enthalten. Markieren Sie Ihre Lösungen für die Aufgaben 7-12 auf dem Antwortbogen.</p><p><b>In welchem Abschnitt...</b></p><p>7. erklärt der Autor eine Ursache für Unternehmensentlassungen?</p><p>8. äußert der Autor eine kritische Bewertung der Situation?</p><p>9. liefert der Autor eine Definition?</p><p>10. nennt der Autor konkrete Beispiele aus der Praxis?</p><p>11. zeigt der Autor Verwunderung über eine Entwicklung?</p><p>12. Zieht der Autor eine Schlussfolgerung oder Empfehlung?</p><h3>a.</h3><p>Der Begriff Personalabbau gehört seit Jahrzehnten zum Wortschatz moderner Wirtschaftsgesellschaften. Darunter versteht man Maßnahmen von Unternehmen, die darauf abzielen, die Zahl der Beschäftigten zu reduzieren. Dies kann auf unterschiedliche Weise geschehen: durch direkte Entlassungen, dureh das Auslaufen befristeter Arbeitsvertrage oder durch sogenannte Frühverrentungsprogramme. In wirtschaftlich schwierigen Zeiten greifen Firmen häufig zu solchen Instrumenten, um Kosten zu senken und ihre Wettbewerbsfähigkeit zu sichern. Gleichzeitig hat sich im Laufe der Zeit eine Vielzahl von euphemistischen Formulierungen entwickelt, die diesen Prozess beschreiben sollen: Man spricht etwa von „Restrukturierung", „Effizienzsteigerung" oder „Optimierung der Personalstruktur". Solche Begriffe klingen technisch und neutral, verdecken jedoch häufig, dass hinter ihnen konkrete menschliche Schicksale stehen. Für die betroffenen Beschäftigten bedeutet Personalabbau nicht nur den Verlust ihres Arbeitsplatzes, sondern häufig auch eine Phase großer Unsicherheit und beruflicher Neuorientierung.</p><h3>b.</h3><p>In den letzten Jahren hat sich jedoch eine Entwicklung gezeigt, die viele Beobachter überrascht. Immer wieder berichten Unternehmen von steigenden Gewinnen und stabilen Umsätzen - und kündigen gleichzeitig umfangreiche Stellenstreichungen an. Fürviele Menschen wirkt dieses Vorgehen widersprüchlich. Wie kann es sein, dass Firmen Personal abbauen, obwohl ihre wirtschaftliche Lage scheinbar solide ist? Wirtschaftsexperten erklären dieses Phänomen damit, dass Unternehmen nicht nur auf ihre aktuelle Situation reagieren, sondern vor allem auf zukünftige Erwartungen. Investoren und Aktionäre verlangen von den Unternehmensleitungen, langfristig profitabel zu bleiben und ihre Effizienz ständig zu steigern. Daher versuchen viele Firmen bereits frühzeitig, ihre Kostenstrukturen zu verändern, selbst wenn die wirtschaftliche Lage noch stabil erscheint. Dass ein Unternehmen Stellen abbaut, bedeutet also nicht unbedingt, dass es sich bereits in einer Krise befindet.</p><h3>c.</h3><p>Die Gründe für Personalabbau sind vielfältig und reichen weit über kurzfristige wirtschaftliche Schwankungen hinaus. Einer der wichtigsten Faktoren ist der technologische Wandel. Automatisierung und Digitalisierung verändern zahlreiche Arbeitsprozesse grundlegend. Tätigkeiten, die früher von mehreren Mitarbeitern erledigt wurden, können heute häufig von Maschinen oder speziellen Softwareprogrammen übernommen werden. Besonders in der Industrie und im Verwaltungsbereich hat dieser Trend zu erheblichen Veränderungen geführt. Ein weiterer wichtiger Faktor ist die Globalisierung. Unternehmen stehen unter ständigem Wettbewerbsdruck und versuchen, ihre Produkte möglichst kostengünstig herzustellen. Wenn Produktionskosten in anderen Ländern niedriger sind, verlagern Firmen ihre Standorte oder reduzieren Personal im Inland. Hinzu kommen interne Umstrukturierungen: Unternehmen passen ihre Organisation immer wieder an neue Marktbedingungen an, legen Abteilungen zusammen oder konzentrieren sich auf bestimmte Kernbereiche. All diese Entwicklungen können dazu führen, dass Arbeitsplätze wegfallen.</p><h3>d.</h3><p>Konkrete Beispiele für solche Entwicklungen lassen sich in vielen Branchen beobachten. In der Automobilindustrie etwa haben mehrere große Hersteller angekündigt, in den kommenden Jahren tausende Stellen abzubauen, weil sie ihre Produktion stärker auf Elektromobilität ausrichten wollen. Dieser technologische Wandel verändert nicht nur die Fahrzeuge selbst, sondern auch die Produktionsprozesse, sodass bestimmte Tätigkeiten künftig weniger Arbeitskräfte erfordern. Auch im Bankensektor zeigt sich ein ähnlicher Trend. Zahlreiche Filialen wurden in den vergangenen Jahren geschlossen, da immer mehr Kunden ihreBankgeschäfte online erledigen. Dadurch verlieren klassische Schalterarbeitsplätze an Bedeutung. Im Einzelhandel wiederum sorgt der wachsende Onlinehandel dafür, dass traditionelle Geschäfte weniger Personal benötigen oder ganz verschwinden. Diese Beispiele verdeutlichen, dass Personalabbau häufig Teil umfassender struktureller Veränderungen ist und nicht allein durch kurzfristige wirtschaftliche Schwierigkeiten erklärt werden kann.</p><h3>e.</h3><p>Gleichzeitig wird in der öffentlichen Diskussion immer häufiger die Frage gestellt, ob Unternehmen ausreichend Verantwortung gegenüber ihren Beschäftigten übernehmen. Kritiker werfen einigen Konzernen vor, Personalabbau zu schnell als scheinbar einfache Lösung zu betrachten, anstatt langfristige Strategien zu entwickeln. Sie argumentieren, dass Investitionen in Weiterbildung oder interne Umschulungsprogramme für die Mitarbeiter nachhaltiger sein könnten. Andere Experten weisen jedoch darauf hin, dass wirtschaftliche Realitaten nicht ignoriert werden dürfen. Unternehmen müssen sich an veränderte Marktbedingungen anpassen, um langfristig bestehen zu können. Dennoch lässt sich aus dieser Entwicklung eine wichtige Schlussfolgerung ziehen: In einer sich schnell wandelnden Arbeitswelt wird es für Arbeitnehmer immer entscheidender, ihre Qualifikationen kontinuierlich weiterzuentwickeln. Lebenslanges Lernen ist damit nicht nur ein Schlagwort, sondern eine zentrale Voraussetzung, um auch in Zukunft berufliche Chancen zu haben.</p><div class="tip ans">Lösungen: 7-c · 8-e · 9-a · 10-d · 11-b · 12-e</div><div class="tip"><b>🧠 题目思路</b><br>7-c：c明确列出导致Personalabbau的原因，尤其是technologischer Wandel、Globalisierung和interne Umstrukturierungen。<br>8-e：e直接呈现Kritiker对企业责任和过快裁员的批评，并提出Weiterbildung/Umschulung等替代方案。<br>9-a：a用“Darunter versteht man ...”直接给出Personalabbau的定义。<br>10-d：d明确写出Automobilindustrie、Bankensektor和Einzelhandel等具体行业案例。<br>11-b：b开头说“eine Entwicklung, die viele Beobachter überrascht”，并提出为什么盈利稳定的企业仍大量裁员。<br>12-e：e最后明确用“Dennoch lässt sich aus dieser Entwicklung eine wichtige Schlussfolgerung ziehen”给出结论和建议，即持续提升资格、终身学习。</div></div><div id="q23" class="hide"><div class="card"><h2>③ Selfies</h2><p><b>Leseverstehen, Teil 2</b></p><p>Lesen Sie den folgenden Text. In welchem Textabsatz (a-e) finden Sie die Antworten auf die Fragen 7-12? Es gibt jeweils nur eine richtige Lösung. Jeder Absatz kann Antworten auf mehrere Fragen enthalten. Markieren Sie Ihre Lösungen für die Aufgaben 7-12 auf dem Antwortbogen.</p><p><b>In welchem Abschnitt...</b></p><p>7. äußert die Autorin Bedauern?</p><p>8. beruft sich die Autorin auf Experten?</p><p>9. gibt die Autorin einen Rat?</p><p>10. macht sich die Autorin über andere lustig?</p><p>11. liefert die Autorin eine Definition?</p><p>12. berichtet die Autorin von einer persönlichen Erfahrung?</p><h3>(A)</h3><p>Letzten Samstag im Restaurant: Das Essen kommt - ein Traum! Pasta mit cremiger Trüffelsauce, gesprenkelt mit Pfefferkörnern, köstlicher Duft steigt mir in die Nase und das Auge isst mit. Mein erster Gedanke: Das muss ich meinen Freunden zeigen. Schon zücke ich das Smartphone. Ob ich den Kellner bitten soll, ein Foto von mir vor meinem Teller zu machen? Lieber nicht, denn das wäre mir peinlich. Gerade schaut keiner zu und ich mache ein Selfie. Aber warum eigentlich dieses Unbehagen? Schließlich ist Selbstdarstellung heute allgegenwärtig: kein Städtetrip ohne Selfies vor den wichtigsten Sehenswürdigkeiten, ganz zu schweigen von Konzerten, Sportveranstaltungen oder Urlaubserlebnissen. Im digitalen Zeitalter hat die Selbstinszenierung noch nie dagewesene Ausmaße angenommen.</p><h3>(B)</h3><p>Warum kommt bei mir bloß immer ein unangenehmes Gefühl auf, wenn ich in der Öffentlichkeit Selfies mache? Nun, ich bin nicht mit dem Smartphone aufgewachsen. In meiner Jugend hat man nicht ständig sich selbst fotografiert, sondern mit Fotos wurden nur ganz besondere Augenblicke festgehalten. Ganz andere Erfahrungen machen die sogenannten Digital Natives. Als solche werden Personen bezeichnet, die mit Smartphone und digitalen Medien großgeworden sind. Für sie ist es selbstverständlich,dass jede Erfahrung es verdient, mit anderen geteilt zu werden, und zwar in Form von Selfies. Heute ist das Selfie längst zum Massenphänomen geworden und der Begriff aus der deutschen Sprache nicht mehr wegzudenken. „Selfie, das: mit der Digitalkamera (des Smartphones oder Tablets) meist spontan aufgenommenes Selbstporträt einer oder mehrerer Personen", heißt es in der Online-Ausgabe des Dudens.</p><h3>(C)</h3><p>Die digitale Fotografie und die Verbreitung von Smartphones haben die Selfies zu einer wahren Flut anwachsen lassen. Und kaum jemand stellt sich mehr die Frage, ob sich die ganze Welt wirklich für seine Alltagserlebnisse - und seien sie noch so banal - interessiert. In meinem Bekanntenkreis gibt es einige, die der Welt ständig voller Stolz präsentieren, was sie alles Tolles erlebt haben: Wenn sie sich zum Frühstück ein gesundes Müsli mit Obst zubereiten, in der Umkleidekabine eine Hose anprobieren oder abends auf dem Balkon ein Glas Rotwein trinken, wird das gleich in Szene gesetzt, als müssten andere angesichts solcher Belanglosigkeiten vor Neid erblassen. Kaum ist das Selfie fertig, wird es hochgeladen. Vielleicht schaut man schnell noch, was Freunde gepostet haben, und ist genervt von der Selfieflut, die einem entgegenspringt.</p><h3>(D)</h3><p>Der Genuss des Augenblicks verschwindet heutzutage oft hinter dem Versuch, das perfekte Bild zu machen. Auf Reisen scheint nicht mehr das Besuchte und zu Entdeckende interessant zu sein, sondern das Festhalten der eigenen, flüchtigen Anwesenheit dort. Aber ist es nicht schade, dass man sich kaum mehr auf das, was man gerade erlebt, einlässt? Ist es nicht das Dilemma unserer Zeit, dass wir vor lauter Sorge um unser Image vergessen zu leben? Was steckt aber hinter diesem Drang zum Selbstbildnis? Für den italienischen Journalisten Marco d'Eramo, der ein sehr lesenswertes Buch zu dem Thema geschrieben hat, ist die Sache klar: „Im Selfie drückt sich ein unbezwingbares Bedürfnis aus, das eigene Dasein zu bestätigen, ein Zeugnis von sich selbst, eine Spur des eigenen In-der-Welt-Seins zu hinterlassen." Das Bedürfnis, sich auf diese Weise mit sich selbst zu beschäftigen, ist gerade bei jüngeren Menschen inzwischen so groß, dass Forscher es sogar als Suchtphänomen identifiziert haben. Psychologen der Trent-Universität in Großbritannien und der Thiagaraja School of Management in Indien gaben ihm den Namen Selfitis.</p><h3>(E)</h3><p>Die meisten Selfies werden ins Netz gestellt, um Reaktionen hervorzurufen. Es geht also auch um Kommunikation. Und außerdem: Was ist denn so verwerflich an der lockeren Art, mit der junge Menschen sich in Szene setzen? War das steife Posieren älterer Generationen vor einer Kamera wirklich weniger auf Wirkung bedacht? Zudem: Selbstvermarktung wird von uns oft geradezu erwartet. Kein Bewerbungsratgeber, in dem nicht von der Erfordernis des Selbstmarketings die Rede wäre. Selfies sind also ein facettenreiches Phänomen, dem man sich mit einer ordentlichen Portion Gelassenheit nähern sollte. Werde ich selbst in Zukunft weniger Selfies machen? Ich werde es probieren und versuchen, stärker den Moment zu genießen. Die beste Empfehlung kann nur lauten: Betrachte dein Leben nicht im Spiegel der Selfies, sondern schau auf das, was dich tatsächlich umgibt. Deine Freunde, leckeres Essen, die Schönheit der Natur - denn die besten Bilder entstehen immer noch im Kopf.</p><div class="tip ans">Lösungen: 7-d · 8-d · 9-e · 10-c · 11-b · 12-a</div><div class="tip"><b>🧠 题目思路</b><br>7-d：作者说“ist es nicht schade, dass man sich kaum mehr auf das, was man gerade erlebt, einlässt?”，明确表达对这种现象的遗憾。<br>8-d：d引用意大利记者Marco d'Eramo的观点，并进一步提到英国和印度的心理学研究者，属于引用专家/研究。<br>9-e：e最后明确提出“Die beste Empfehlung kann nur lauten”，直接给出建议：不要只从自拍镜头看生活，要关注身边真实的事物。<br>10-c：c用夸张讽刺的方式描写朋友把吃麦片、试裤子、喝红酒等普通小事拍成值得别人羡慕的事情，带有嘲讽意味。<br>11-b：b用“Als solche werden Personen bezeichnet...”定义Digital Natives，并引用Duden给出Selfie的词典定义。题目问Definition，因此对应b。<br>12-a：a从“Letzten Samstag im Restaurant”开始讲自己的亲身经历，包括自己吃饭、拿手机和自拍的过程。</div></div>`;function install(){const d=document.getElementById('master').contentDocument;if(!d||!d.body){setTimeout(install,50);return}const old=d.getElementById('t2');if(!old)return;old.innerHTML=teil2;const s=d.createElement('style');s.textContent='.q2active{background:#222!important;color:#fff!important}';d.head.appendChild(s);d.defaultView.Q2=function(n,b){d.getElementById('q21').classList.toggle('hide',n!==1);d.getElementById('q22').classList.toggle('hide',n!==2);d.getElementById('q23').classList.toggle('hide',n!==3);d.querySelectorAll("#t2 .card:first-child button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add('active')};const oldS=d.defaultView.S;d.defaultView.S=function(id,b){oldS(id,b);if(id==='t2'){const q=d.getElementById('q21');if(q&&!d.querySelector('#t2 .card:first-child button.active'))q.classList.remove('hide')}}}document.getElementById('master').addEventListener('load',install);})();</script></body></html>
