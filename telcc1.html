<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELC C1 · Leseverstehen</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="master" src="telcc1-master.html" title="TELC C1"></iframe><script>(function(){const teil2=`<div class="card"><h2>Teil 2 · 题目目录</h2><button class="active" onclick="Q2(1,this)">① Wege der Migration - Ein persönliches Protokoll</button></div><div id="q21"><div class="card"><h2>① Wege der Migration - Ein persönliches Protokoll</h2><p><b>Leseverstehen, Teil 2</b></p><p>Lesen Sie den folgenden Text. In welchem Textabsatz a-e finden Sie die Antworten auf die Fragen 7-12. Es gibt jeweils nur eine richtige Lösung. Jeder Absatz kann Antworten auf mehrere Fragen enthalten. Markieren Sie Ihre Lösungen für die Aufgaben 7-12 auf dem Antwortbogen.</p><p><b>In welchem Abschnitt ...</b></p><p>7. Drückt der Autor Hoffnung auf eine bessere Zukunft aus?</p><p>8. Geht der Autor auf die Existenz von Vorurteilen in der Gesellschaft ein?</p><p>9. Hinterfragt der Autor den eigenen Weg?</p><p>10. Beschreibt der Autor ein Gefühl der Entfremdung in der neuen Umgebung?</p><p>11. Ruft der Autor zur Solidarität mit anderen Migrant/innen auf?</p><p>12. Kritisiert der Autor bürokratische Hürden?</p><h3>a.</h3><p>Ich sitze in meinem Glasbüro in einem Berliner Software-Startup und betrachte das geschäftige Treiben auf der Torstraße. Fast ein Jahrzehnt ist vergangen, seit ich mein Heimatland mit nichts als einem Koffer und einem exzellenten Masterabschluss in Informatik verlassen habe. Damals wiegte ich mich in der trügerischen Sicherheit, dass technisches Know-how eine universelle Währung sei, die mir sofort alle Türen öffnen würde. Doch die Realität der ersten Jahre glich eher einem Schattendasein. Ich fühlte mich wie ein Statist in einem fremdsprachigen Film, dessen Dialoge ich zwar mühsam dechiffrieren konnte, dessen kulturelle Untertöne und feine Ironie mir jedoch verschlossen blieben. Es ist eine zutiefst verstörende Erfahrung, wenn die eigene kognitive Leistungsfähigkeit vom Gegenüber unbewusst an der Perfektion der Aussprache oder der Wahl der Präpositionen gemessen wird. Diese subtile Form der Depersonalisierung in alltäglichen Gesprächen hinterlässt Spuren, die auch nach Jahren des beruflichen Erfolgs nicht gänzlich verheilen.</p><h3>b.</h3><p>Rückblickend muss ich eingestehen, dass mein anfänglicher Eifer, mich bis zur Unkenntlichkeit anzupassen, ein psychologischer Holzweg war. In dem obsessiven Bestreben, alles „typisch Deutsche" zu internalisieren und jede Spur meiner Herkunft zu tilgen, verlor ich zeitweise den Kontakt zu meinen eigenen Werten. Ich war oft unerbittlich mit mir selbst, legte eine fast schon masochistische Arbeitsdisziplin an den Tag, nur um die vermeintliche Unterlegenheit meiner migrantischen Biografie durch doppelte Leistung zu kompensieren. Heute betrachte ich diesen Perfektionsdrang als eine Form der Selbstverleugnung. Ich hätte mir damals die Freiheit zugestehen müssen, Fehler zu machen und meine Andersartigkeit nicht als Defizit, sondern als legitimen Teil meiner Identität zu begreifen. Stattdessen fungierte ich als mein eigener strengster Kontrolleur, immer auf der Hut, bloß keine Angriffsfläche für Kritik zu bieten.</p><h3>c.</h3><p>Was mich jedoch bis heute mit einer Mischung aus Zorn und Fassungslosigkeit erfüllt, ist die institutionelle Kälte, die einem in den hiesigen Amtsstuben entgegenschlägt. Man wird als dringend benötigte Hochwertfachkraft angeworben, findet sich dann aber in endlosen Warteschlangen wieder, um von Sachbearbeitern belehrt zu werden, die im Dickicht ihrer eigenen Verwaltungsvorschriften gefangen scheinen. Diese sprachlichen Barrieren, manifestiert in einem kryptischen Beamtendeutsch, wirken wie eine absichtliche Exklusionsstrategie. Es drängt sich der Verdacht auf, dass die bürokratischen Hürden nicht nur der Ordnung dienen, sondern als eine Art inoffizieller Belastungstest fungieren, der die psychische Belastbarkeit der Neuankömmlinge auf die Probe stellen soll. Die Diskrepanz zwischen der politischen Rhetorik der „Willkommenskultur" und der gelebten administrativen Realität ist ein systemisches Versagen, das wertvolle Potenziale im Keim erstickt.</p><h3>d.</h3><p>Trotz des viel beschworenen Fachkräftemangels und der Omnipräsenz des Begriffs „Diversity" in modernen Firmenbroschüren, sind die gläsernen Decken für Menschen mit Migrationshintergrund nach wie vor Realität. Es ist eine bittere Ironie, dass man zwar als „Bereicherung" gefeiert wird, solange man reibungslos funktioniert, aber sofort auf hartnäckige Stereotypen stößt, sobald man Führungsansprüche anmeldet. Oftmals werden Migranten unbewusst in bestimmte Nischen gedrängt - etwa für die Kommunikation mit schwierigen Auslandsmärkten -, während die strategischen Kernentscheidungen in einem homogenen Zirkel verbleiben. Diese unterschwellige Kategorisierung ist umso gefährlicher, da sie meist freundlich lächelnd daherkommt. Man wird für seine „interkulturelle Kompetenz" gelobt, was im Klartext oft bedeutet, dass man für die Position des klassischen Entscheidungsträgers schlicht nicht vorgesehen ist.</p><h3>e.</h3><p>Allen, die sich momentan in der kräftezehrenden Phase der ersten Ankunft befinden, möchte ich zurufen: Bewahrt euch eure Resilienz und lasst euch nicht von der Kälte der Paragrafen entmutigen. Der Weg zur gesellschaftlichen Teilhabe ist kein Sprint, sondern ein Marathon, den man nicht alleine bestreiten sollte. Wir müssen damit beginnen, belastbare Netzwerke der Solidarität zu knüpfen, in denen wir Wissen weitergeben und uns gegenseitig stützen, um die strukturellen Benachteiligungen kollektiv aufzubrechen. Trotz der unbestreitbaren Defizite im System blicke ich mit vorsichtigem Optimismus in die Zukunft. Die demografische Realität wird dieses Land unweigerlich dazu zwingen, echte Inklusion zu lernen. Unsere Präsenz ist kein Bittgang, sondern die vitale Chance für eine Gesellschaft, die ohne den Zustrom von außen ihre eigene Innovationsfähigkeit einbüßen würde. Bleibt standhaft - der Wandel ist bereits im Gange.</p><div class="tip ans">Lösungen: 7-e · 8-d · 9-b · 10-a · 11-e · 12-c</div><div class="tip"><b>🧠 题目思路</b><br>7-e：作者说“blicke ich mit vorsichtigem Optimismus in die Zukunft”并指出“der Wandel ist bereits im Gange”，明确表达对未来的希望。<br>8-d：d中直接出现“hartnäckige Stereotypen”和“unterschwellige Kategorisierung”，对应社会中的偏见与刻板印象。<br>9-b：“Rückblickend muss ich eingestehen”以及“psychologischer Holzweg”是在回顾并反思自己当初的选择。<br>10-a：“fühlte mich wie ein Statist in einem fremdsprachigen Film”以及“Depersonalisierung”明确描述在新环境中的疏离感。<br>11-e：“Wir müssen ... Netzwerke der Solidarität knüpfen”直接号召移民之间建立互助与团结网络。<br>12-c：“endlosen Warteschlangen”“Verwaltungsvorschriften”“kryptisches Beamtendeutsch”“bürokratischen Hürden”集中批评官僚程序和行政障碍。</div></div>`;function install(){const d=document.getElementById('master').contentDocument;if(!d||!d.body){setTimeout(install,50);return}const old=d.getElementById('t2');if(!old)return;old.innerHTML=teil2;const s=d.createElement('style');s.textContent='.q2active{background:#222!important;color:#fff!important}';d.head.appendChild(s);d.defaultView.Q2=function(n,b){const box=d.getElementById('q21');if(box)box.classList.remove('hide');d.querySelectorAll("#t2 .card:first-child button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active")};const oldS=d.defaultView.S;d.defaultView.S=function(id,b){oldS(id,b);if(id==='t2'){const q=d.getElementById('q21');if(q)q.classList.remove('hide')}}}document.getElementById('master').addEventListener('load',install);})();</script></body></html>
