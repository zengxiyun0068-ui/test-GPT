<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELC C1 · Leseverstehen</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="master" src="telcc1-master.html?v=20260826-12" title="TELC C1"></iframe><script>(function(){const frame=document.getElementById('master');function install(){try{const d=frame.contentDocument;if(!d||!d.body){setTimeout(install,50);return}const target=d.getElementById('t2');const t3=d.getElementById('t3');if(!target||!t3){setTimeout(install,100);return}fetch('teil2-v3.html?v=20260826-12',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Teil 2 加载失败 '+r.status);return r.text()}).then(html=>{const parsed=new DOMParser().parseFromString(html,'text/html');target.innerHTML=parsed.body.innerHTML;const old=target.querySelector('#q24');if(old){old.id='q25';old.classList.remove('hide')}const nav=target.querySelector('.app>.card:first-child');if(!nav)throw new Error('Teil 2 目录不存在');nav.innerHTML='<h2>Teil 2 · 题目目录</h2><button class="active">① Wege der Migration - Ein persönliches Protokoll</button><button class="sub">② Wenn Unternehmen Personal abbauen</button><button class="sub">③ Selfies</button><button class="sub">④ Bilinmeyen</button><button class="sub">⑤ Smartwatches für Kinder</button>';return fetch('teil2-bilinmeyen.html?v=20260826-12',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Bilinmeyen 加载失败 '+r.status);return r.text()}).then(extra=>{const p=new DOMParser().parseFromString(extra,'text/html');const fourth=p.body.querySelector('#q24');if(!fourth)throw new Error('Bilinmeyen 内容不存在');fourth.id='q24';fourth.classList.add('hide');target.appendChild(fourth);return nav})}).then(nav=>{const buttons=nav.querySelectorAll('button');d.defaultView.Q2=function(n,b){for(let i=1;i<=5;i++){const el=d.getElementById('q2'+i);if(el)el.classList.toggle('hide',i!==n)}buttons.forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')};buttons.forEach((b,i)=>{b.onclick=function(){d.defaultView.Q2(i+1,b)}});d.defaultView.Q2(1,buttons[0]);return fetch('teil3-tourismus.html?v=20260826-12',{cache:'no-store'})}).then(r=>{if(!r.ok)throw new Error('Teil 3 加载失败 '+r.status);return r.text()}).then(html=>{const p=new DOMParser().parseFromString(html,'text/html');t3.innerHTML=p.body.innerHTML;t3.dataset.loaded='1';addRandomSelector(d)}).catch(e=>{console.error(e);if(t3)t3.innerHTML='<div class="card"><h2>Teil 3</h2><p style="color:#b00">Teil 3 加载失败：'+e.message+'</p><p>请刷新页面重试。</p></div>'})}catch(e){console.error(e);setTimeout(install,100)}}function addRandomSelector(d){if(d.getElementById('randomTestModal'))return;const style=d.createElement('style');style.textContent='.rt-overlay{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9999;padding:18px}.rt-box{background:#fff;max-width:520px;width:100%;border-radius:22px;padding:24px;box-shadow:0 18px 60px #0004}.rt-box h2{margin-top:0}.rt-check{display:flex;align-items:center;gap:10px;padding:12px 4px;font-size:17px}.rt-check input{width:20px;height:20px}.rt-actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}.rt-start{background:#222;color:#fff}.rt-cancel{background:#e9edf7}.rt-note{color:#666;font-size:14px}.rt-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;z-index:10000;box-shadow:0 8px 30px #0003}';d.head.appendChild(style);const tabs=d.getElementById('tabs');const randomBtn=[...tabs.querySelectorAll('button')].find(b=>b.textContent.includes('随机测试'));if(!randomBtn)return;randomBtn.onclick=function(e){if(e)e.preventDefault();openRandom()};const modal=d.createElement('div');modal.id='randomTestModal';modal.className='rt-overlay';modal.style.display='none';modal.innerHTML='<div class="rt-box"><h2>🎲 随机测试</h2><p>先选择你想练习的 Teil。系统会从选中的 Teil 随机抽取一篇题目。</p><label class="rt-check"><input type="checkbox" value="1" checked> 📖 Teil 1</label><label class="rt-check"><input type="checkbox" value="2" checked> 📖 Teil 2</label><label class="rt-check"><input type="checkbox" value="3" checked> 📖 Teil 3</label><p class="rt-note">Teil 1、Teil 2 会随机到具体文章；Teil 3 目前有 Tourismus。</p><div class="rt-actions"><button class="rt-start">开始随机测试</button><button class="rt-cancel">取消</button></div></div>';d.body.appendChild(modal);modal.querySelector('.rt-cancel').onclick=()=>modal.style.display='none';modal.querySelector('.rt-start').onclick=()=>{const chosen=[...modal.querySelectorAll('input:checked')].map(x=>x.value);if(!chosen.length){toast('请至少选择一个 Teil');return}modal.style.display='none';runRandom(chosen)};function openRandom(){modal.style.display='flex'}function toast(msg){const x=d.createElement('div');x.className='rt-toast';x.textContent=msg;d.body.appendChild(x);setTimeout(()=>x.remove(),1800)}function runRandom(chosen){const part=chosen[Math.floor(Math.random()*chosen.length)];if(part==='1'){d.defaultView.S('t1',tabs.querySelectorAll('button')[0]);const bs=d.querySelectorAll('#t1 .card:first-child button');if(bs.length){const i=Math.floor(Math.random()*bs.length);bs[i].click();setTimeout(()=>{d.getElementById('t1').scrollIntoView({block:'start'});toast('随机到 Teil 1：'+bs[i].textContent.replace(/^①|^②|^③|^④|^⑤/,'').trim())},80)}}else if(part==='2'){d.defaultView.S('t2',tabs.querySelectorAll('button')[1]);const bs=d.querySelectorAll('#t2 .card:first-child button');if(bs.length){const i=Math.floor(Math.random()*bs.length);bs[i].click();setTimeout(()=>{d.getElementById('t2').scrollIntoView({block:'start'});toast('随机到 Teil 2：'+bs[i].textContent.replace(/^①|^②|^③|^④|^⑤/,'').trim())},80)}}else{d.defaultView.S('t3',tabs.querySelectorAll('button')[2]);setTimeout(()=>{d.getElementById('t3').scrollIntoView({block:'start'});toast('随机到 Teil 3：Tourismus')},80)}}}frame.addEventListener('load',install);install()})();</script></body></htm
