<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELC C1 · Leseverstehen</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="master" src="telcc1-master.html?v=20260826-16" title="TELC C1"></iframe><script>(function(){const frame=document.getElementById('master');function install(){try{const d=frame.contentDocument;if(!d||!d.body){setTimeout(install,50);return}let target=d.getElementById('t2'),t3=d.getElementById('t3');const app=d.querySelector('.app');if(!app){setTimeout(install,100);return}if(!target){target=d.createElement('section');target.id='t2';target.className='hide';app.appendChild(target)}if(!t3){t3=d.createElement('section');t3.id='t3';t3.className='hide';app.appendChild(t3)}fetch('teil2-v3.html?v=20260826-16',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Teil 2 加载失败 '+r.status);return r.text()}).then(html=>{const p=new DOMParser().parseFromString(html,'text/html');target.innerHTML=p.body.innerHTML;const old=target.querySelector('#q24');if(old){old.id='q25';old.classList.remove('hide')}const nav=target.querySelector('.app>.card:first-child');if(!nav)throw Error('Teil 2 目录不存在');nav.innerHTML='<h2>Teil 2 · 题目目录</h2><button class="active">① Wege der Migration - Ein persönliches Protokoll</button><button class="sub">② Wenn Unternehmen Personal abbauen</button><button class="sub">③ Selfies</button><button class="sub">④ Bilinmeyen</button><button class="sub">⑤ Smartwatches für Kinder</button>';return fetch('teil2-bilinmeyen.html?v=20260826-16',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Bilinmeyen 加载失败 '+r.status);return r.text()}).then(x=>{const q=new DOMParser().parseFromString(x,'text/html').body.querySelector('#q24');if(!q)throw Error('Bilinmeyen 内容不存在');q.classList.add('hide');target.appendChild(q);return nav})}).then(nav=>{const buttons=nav.querySelectorAll('button');d.defaultView.Q2=function(n,b){for(let i=1;i<=5;i++){const el=d.getElementById('q2'+i);if(el)el.classList.toggle('hide',i!==n)}buttons.forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')};buttons.forEach((b,i)=>b.onclick=()=>d.defaultView.Q2(i+1,b));d.defaultView.Q2(1,buttons[0]);return fetch('teil3-tourismus.html?v=20260826-16',{cache:'no-store'})}).then(r=>{if(!r.ok)throw Error('Teil 3 加载失败 '+r.status);return r.text()}).then(x=>{t3.innerHTML=new DOMParser().parseFromString(x,'text/html').body.innerHTML;t3.dataset.loaded='1';installQuiz(d)}).catch(e=>{console.error(e);if(t3)t3.innerHTML='<div class="card"><h2>Teil 3</h2><p style="color:#b00">加载失败：'+e.message+'</p></div>'})}catch(e){console.error(e);setTimeout(install,100)}}function installQuiz(d){if(d.getElementById('realRandomQuiz'))return;const st=d.createElement('style');st.textContent='.rq-overlay{position:fixed;inset:0;background:#0008;z-index:99999;overflow:auto;padding:20px;box-sizing:border-box}.rq-box{max-width:900px;margin:0 auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 70px #0005}.rq-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.rq-select{display:flex;flex-direction:column;gap:10px;margin:20px 0}.rq-part{display:block;width:100%;box-sizing:border-box;text-align:left;background:#f4f5f8;color:#222;border:2px solid transparent;margin:0;padding:16px;border-radius:14px;font-size:17px;cursor:pointer}.rq-part:hover{background:#e9edf7}.rq-part.selected{border-color:#222;background:#e9edf7;font-weight:700}.rq-q{padding:16px 0;border-top:1px solid #eee}.rq-q h3{margin:0 0 10px}.rq-opt{display:block;width:100%;text-align:left;background:#f4f5f8;margin:6px 0;padding:12px;border-radius:12px}.rq-opt.selected{outline:2px solid #222}.rq-submit{background:#222;color:#fff}.rq-close{background:#e9edf7}.rq-result{font-size:20px;font-weight:700;padding:16px;border-radius:14px;background:#f1f3f7;margin-top:16px}.rq-correct{background:#d9f2df!important}.rq-wrong{background:#f8dddd!important}.rq-note{color:#666}.rq-progress{position:sticky;top:0;background:#fff;padding:8px 0;z-index:2}.rq-startover{background:#222;color:#fff}.rq-disabled{opacity:.45;pointer-events:none}';d.head.appendChild(st);const tabs=d.getElementById('tabs');const rb=[...tabs.querySelectorAll('button')].find(b=>b.textContent.includes('随机测试'));if(!rb)return;rb.removeAttribute('onclick');rb.onclick=e=>{e.preventDefault();choose()};const overlay=d.createElement('div');overlay.id='realRandomQuiz';overlay.className='rq-overlay';overlay.style.display='none';d.body.appendChild(overlay);function choose(){overlay.innerHTML='<div class="rq-box"><div class="rq-head"><h2>🎲 随机测试</h2><button class="rq-close">×</button></div><p>先选择你要测试的 Teil。选中后再点击“开始测试”。</p><div class="rq-select"><button class="rq-part" data-part="1">📖 Teil 1<br><small>Textrekonstruktion</small></button><button class="rq-part" data-part="2">📖 Teil 2<br><small>Textabsätze 7–12</small></button><button class="rq-part" data-part="3">📖 Teil 3<br><small>r / f / -，13–23 + 标题</small></button></div><button class="rq-submit rq-disabled" id="rqBegin">开始测试</button></div>';overlay.style.display='block';let selected=null;overlay.querySelector('.rq-close').onclick=()=>overlay.style.display='none';overlay.querySelectorAll('.rq-part').forEach(b=>b.onclick=()=>{overlay.querySelectorAll('.rq-part').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=+b.dataset.part;overlay.querySelector('#rqBegin').classList.remove('rq-disabled')});overlay.querySelector('#rqBegin').onclick=()=>{if(selected)build(selected)}}function getSolution(card){const el=card.querySelector('.ans');if(!el)return{};const m=el.textContent.match(/Lösungen?:\s*(.*)/i);if(!m)return{};const out={};(m[1].match(/\d+\s*[-–:]\s*\(?[a-z-]+\)?/gi)||[]).forEach(s=>{const z=s.match(/(\d+)\s*[-–:]\s*\(?([a-z-]+)\)?/i);if(z)out[z[1]]=z[2].toLowerCase()});return out}function build(part){let card,title,questions,answers,choices;if(part===1){const id=1+Math.floor(Math.random()*5);card=d.getElementById('q'+id);title=card?.querySelector('h2')?.textContent||'Teil 1';answers=getSolution(card);const opts=[...card.querySelectorAll('.opt')].map(x=>x.textContent.trim());questions=Object.keys(answers).sort((a,b)=>+a-+b).map(n=>({n,text:'Lücke '+n}));choices=opts.map(x=>({key:(x.match(/^([a-h])\./i)||[])[1]?.toLowerCase()||'',text:x})).filter(x=>x.key)}else if(part===2){const id=21+Math.floor(Math.random()*5);card=d.getElementById('q'+id);title=card?.querySelector('h2')?.textContent||'Teil 2';answers=getSolution(card);const lines=(card?.querySelector('.questions')?.innerText||'').split(/\n/).map(x=>x.trim()).filter(x=>/^\d+[.)]/.test(x));questions=lines.map(x=>{const m=x.match(/^(\d+)[.)]\s*(.*)$/);return{n:m[1],text:m[2]}});choices=['a','b','c','d','e'].map(k=>({key:k,text:k.toUpperCase()}))}else{card=t3;title=card.querySelector('h2')?.textContent||'Tourismus';answers=getSolution(card);const lines=(card.querySelector('.questions')?.innerText||'').split(/\n/).map(x=>x.trim()).filter(x=>/^\d+[.)]/.test(x));questions=lines.map(x=>{const m=x.match(/^(\d+)[.)]\s*(.*)$/);return{n:m[1],text:m[2]}}).filter(x=>+x.n<=23);choices=[{key:'r',text:'r — richtig'},{key:'f',text:'f — falsch'},{key:'-',text:'- — nicht im Text enthalten'}]}if(!card||!questions.length||Object.keys(answers).length<questions.length){toast('这篇题目暂时无法生成测试，请再点一次随机测试');return}renderQuiz(title,questions,answers,choices)}function renderQuiz(title,questions,answers,choices){overlay.innerHTML='<div class="rq-box"><div class="rq-head"><h2>📝 '+esc(title)+'</h2><button class="rq-close">×</button></div><p class="rq-note">答案不会显示。全部做完后点击“提交并评分”。</p><div class="rq-progress" id="rqProgress">0 / '+questions.length+' 已作答</div><div id="rqQs"></div><button class="rq-submit" id="rqSubmit">提交并评分</button><div id="rqResult"></div></div>';overlay.style.display='block';overlay.querySelector('.rq-close').onclick=()=>overlay.style.display='none';const qs=overlay.querySelector('#rqQs');questions.forEach(q=>{const sec=d.createElement('div');sec.className='rq-q';sec.innerHTML='<h3>'+esc(q.n+'. '+q.text)+'</h3>';choices.forEach(c=>{const b=d.createElement('button');b.className='rq-opt';b.dataset.key=c.key;b.textContent=c.text;b.onclick=()=>{[...sec.querySelectorAll('.rq-opt')].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');sec.dataset.answer=c.key;overlay.querySelector('#rqProgress').textContent=[...qs.querySelectorAll('.rq-q')].filter(x=>x.dataset.answer).length+' / '+questions.length+' 已作答'};sec.appendChild(b)});qs.appendChild(sec)});overlay.querySelector('#rqSubmit').onclick=()=>{let score=0;[...qs.querySelectorAll('.rq-q')].forEach(sec=>{const n=sec.querySelector('h3').textContent.match(/^(\d+)/)[1],given=sec.dataset.answer,right=answers[n];if(given===right){score++;sec.querySelector('[data-key="'+given+'"]')?.classList.add('rq-correct')}else{if(given)sec.querySelector('[data-key="'+given+'"]')?.classList.add('rq-wrong');sec.querySelector('[data-key="'+right+'"]')?.classList.add('rq-correct')}});const pct=Math.round(score/questions.length*100);overlay.querySelector('#rqResult').innerHTML='<div class="rq-result">成绩：'+score+' / '+questions.length+'（'+pct+'%）<br><span class="rq-note">绿色 = 正确答案，红色 = 你的错误答案。</span></div><button class="rq-startover" id="rqAgain">再来一套</button>';overlay.querySelector('#rqSubmit').disabled=true;overlay.querySelector('#rqAgain').onclick=choose}}function esc(s){return String(s).replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}function toast(x){overlay.innerHTML='<div class="rq-box"><h2>提示</h2><p>'+esc(x)+'</p><button class="rq-submit" onclick="this.closest(\'.rq-overlay\').style.display=\'none\'">返回</button></div>';overlay.style.display='block'}frame.addEventListener('load',install);install()})();</script></body></html>
