<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELC C1 · Leseverstehen</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="master" src="telcc1-master.html?v=20260826-16" title="TELC C1"></iframe><script>(function(){const frame=document.getElementById('master');const V='20260826-16';function loadText(u){return fetch(u+'?v='+V,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('加载失败 '+r.status);return r.text()})}function install(){const d=frame.contentDocument;if(!d||!d.body){setTimeout(install,100);return}const t2=d.getElementById('t2'),t3=d.getElementById('t3');if(!t2||!t3){setTimeout(install,100);return}loadText('teil2-v3.html').then(html=>{const p=new DOMParser().parseFromString(html,'text/html');t2.innerHTML=p.body.innerHTML;const smart=t2.querySelector('#q24');if(smart)smart.id='q25';return loadText('teil2-bilinmeyen.html').then(html2=>{const q=new DOMParser().parseFromString(html2,'text/html').body.querySelector('#q24');if(q){q.classList.add('hide');t2.appendChild(q)}const nav=t2.querySelector('.app>.card:first-child');if(nav)nav.innerHTML='<h2>Teil 2 · 题目目录</h2><button class="active">① Wege der Migration - Ein persönliches Protokoll</button><button class="sub">② Wenn Unternehmen Personal abbauen</button><button class="sub">③ Selfies</button><button class="sub">④ Bilinmeyen</button><button class="sub">⑤ Smartwatches für Kinder</button>';if(nav){const bs=[...nav.querySelectorAll('button')];d.defaultView.Q2=function(n,b){for(let i=1;i<=5;i++){const e=d.getElementById('q2'+i);if(e)e.classList.toggle('hide',i!==n)}bs.forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')};bs.forEach((b,i)=>b.onclick=()=>d.defaultView.Q2(i+1,b));d.defaultView.Q2(1,bs[0])}})}).then(()=>loadText('teil3-tourismus.html')).then(html=>{t3.innerHTML=new DOMParser().parseFromString(html,'text/html').body.innerHTML;installRandom(d)}).catch(e=>{console.error(e);t3.innerHTML='<div class="card"><h2>Teil 3</h2><p style="color:#b00">'+e.message+'</p></div>'})}function installRandom(d){if(d.getElementById('realRandomQuiz'))return;const css=d.createElement('style');css.textContent='.rq-overlay{position:fixed;inset:0;background:#0008;z-index:999999;overflow:auto;padding:20px;box-sizing:border-box}.rq-box{max-width:900px;margin:20px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 70px #0005}.rq-head{display:flex;justify-content:space-between;align-items:center}.rq-select{display:grid;gap:12px;margin:20px 0}.rq-part{display:block;width:100%;text-align:left;background:#f4f5f8;color:#222;border:2px solid transparent;margin:0;padding:16px;border-radius:14px;font-size:17px}.rq-part.selected{border-color:#222;background:#e9edf7;font-weight:700}.rq-opt{display:block;width:100%;text-align:left;background:#f4f5f8;margin:6px 0;padding:12px;border-radius:12px;border:0}.rq-opt.selected{outline:2px solid #222}.rq-correct{background:#d9f2df!important}.rq-wrong{background:#f8dddd!important}.rq-submit{background:#222;color:#fff;border:0;border-radius:11px;padding:12px 16px}.rq-close{background:#e9edf7;border:0;border-radius:11px;padding:8px 13px;font-size:20px}.rq-progress{position:sticky;top:0;background:#fff;padding:8px 0;z-index:2}.rq-result{font-size:20px;font-weight:700;padding:16px;border-radius:14px;background:#f1f3f7;margin-top:16px}.rq-note{color:#666}.rq-q{padding:16px 0;border-top:1px solid #eee}.rq-q h3{margin:0 0 10px}.rq-start{background:#222;color:#fff;border:0;border-radius:11px;padding:12px 16px}';d.head.appendChild(css);const tabs=d.getElementById('tabs');const rb=[...tabs.querySelectorAll('button')].find(b=>b.textContent.includes('随机测试'));if(!rb)return;rb.removeAttribute('onclick');const overlay=d.createElement('div');overlay.id='realRandomQuiz';overlay.className='rq-overlay';overlay.style.display='none';d.body.appendChild(overlay);rb.onclick=function(e){e.preventDefault();choose()};function choose(){overlay.innerHTML='<div class="rq-box"><div class="rq-head"><h2>🎲 随机测试</h2><button class="rq-close">×</button></div><p>请选择要测试的 Teil。这里是真正的答题模式，提交后才显示对错。</p><div class="rq-select"><button class="rq-part" data-part="1">📖 Teil 1<br><small>Textrekonstruktion · 随机一篇</small></button><button class="rq-part" data-part="2">📖 Teil 2<br><small>Textabsätze 7–12 · 随机一篇</small></button><button class="rq-part" data-part="3">📖 Teil 3<br><small>r / f / - · 随机一篇</small></button></div><button class="rq-submit" id="rqBegin" disabled>开始测试</button></div>';overlay.style.display='block';let picked=0;overlay.querySelector('.rq-close').onclick=()=>overlay.style.display='none';overlay.querySelectorAll('.rq-part').forEach(b=>b.onclick=()=>{overlay.querySelectorAll('.rq-part').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');picked=Number(b.dataset.part);overlay.querySelector('#rqBegin').disabled=false});overlay.querySelector('#rqBegin').onclick=()=>picked&&build(picked)}function solution(card){const a=card&&card.querySelector('.ans');if(!a)return{};const s=a.textContent.replace(/Lösungen?:/i,'');const out={};for(const m of s.matchAll(/(\d+)\s*[-–:]\s*\(?([a-z-]+)\)?/gi))out[m[1]]=m[2].toLowerCase();return out}function build(part){let card,title,questions,answers,choices;if(part===1){const cards=[1,2,3,4,5].map(i=>d.getElementById('q'+i)).filter(Boolean);card=cards[Math.floor(Math.random()*cards.length)];title=card.querySelector('h2')?.textContent||'Teil 1';answers=solution(card);questions=Object.keys(answers).sort((a,b)=>+a-+b).map(n=>({n,text:'Lücke '+n}));choices=[...card.querySelectorAll('.opt')].map(x=>x.textContent.trim()).map(x=>({key:(x.match(/^([a-h])\./i)||[])[1]?.toLowerCase(),text:x})).filter(x=>x.key)}else if(part===2){const cards=[1,2,3,4,5].map(i=>d.getElementById('q2'+i)).filter(Boolean);card=cards[Math.floor(Math.random()*cards.length)];title=card.querySelector('h2')?.textContent||'Teil 2';answers=solution(card);questions=[...(card.querySelector('.questions')?.innerText||'').matchAll(/(\d+)[.)]\s*([^\n]+)/g)].map(m=>({n:m[1],text:m[2]}));choices=['a','b','c','d','e'].map(k=>({key:k,text:k.toUpperCase()}))}else{card=t3;title=card.querySelector('h2')?.textContent||'Teil 3';answers=solution(card);questions=[...(card.querySelector('.questions')?.innerText||'').matchAll(/(\d+)[.)]\s*([^\n]+)/g)].map(m=>({n:m[1],text:m[2]})).filter(q=>+q.n<=23);choices=[{key:'r',text:'r — richtig'},{key:'f',text:'f — falsch'},{key:'-',text:'- — nicht im Text enthalten'}]}if(!card||!questions.length||Object.keys(answers).length<questions.length){alert('这篇题目的答案读取失败，请再点一次随机测试。');return}render(title,questions,answers,choices)}function render(title,questions,answers,choices){overlay.innerHTML='<div class="rq-box"><div class="rq-head"><h2>📝 '+esc(title)+'</h2><button class="rq-close">×</button></div><p class="rq-note">现在是正式测试：先自己做，提交后才显示对错。</p><div class="rq-progress" id="rqProgress">0 / '+questions.length+' 已作答</div><div id="rqQs"></div><button class="rq-submit" id="rqSubmit">提交并评分</button><div id="rqResult"></div></div>';overlay.style.display='block';overlay.querySelector('.rq-close').onclick=()=>overlay.style.display='none';const qs=overlay.querySelector('#rqQs');questions.forEach(q=>{const sec=d.createElement('div');sec.className='rq-q';sec.innerHTML='<h3>'+esc(q.n+'. '+q.text)+'</h3>';choices.forEach(c=>{const b=d.createElement('button');b.className='rq-opt';b.dataset.key=c.key;b.textContent=c.text;b.onclick=()=>{sec.querySelectorAll('.rq-opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');sec.dataset.answer=c.key;overlay.querySelector('#rqProgress').textContent=[...qs.querySelectorAll('.rq-q')].filter(x=>x.dataset.answer).length+' / '+questions.length+' 已作答'};sec.appendChild(b)});qs.appendChild(sec)});overlay.querySelector('#rqSubmit').onclick=()=>{let score=0;qs.querySelectorAll('.rq-q').forEach(sec=>{const n=sec.querySelector('h3').textContent.match(/^(\d+)/)[1],given=sec.dataset.answer,right=answers[n];if(given===right){score++;if(given)sec.querySelector('[data-key="'+given+'"]')?.classList.add('rq-correct')}else{if(given)sec.querySelector('[data-key="'+given+'"]')?.classList.add('rq-wrong');sec.querySelector('[data-key="'+right+'"]')?.classList.add('rq-correct')}});const pct=Math.round(score/questions.length*100);overlay.querySelector('#rqResult').innerHTML='<div class="rq-result">成绩：'+score+' / '+questions.length+'（'+pct+'%）<br><span class="rq-note">绿色 = 正确答案，红色 = 你的错误答案。</span></div><button class="rq-start" id="rqAgain">再来一套</button>';overlay.querySelector('#rqSubmit').disabled=true;overlay.querySelector('#rqAgain').onclick=choose}}function esc(s){return String(s).replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}frame.addEventListener('load',install);install()})();</script></body></html>
