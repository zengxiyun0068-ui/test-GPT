<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELC C1 · 随机测试</title><style>body{margin:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}.app{max-width:900px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #0001}.btn{border:0;border-radius:11px;padding:11px 15px;margin:4px;background:#e9edf7;font-size:15px;cursor:pointer}.btn.active,.primary{background:#222;color:#fff}.choice{display:block;width:100%;text-align:left;border:0;border-radius:11px;background:#f0f2f6;padding:12px;margin:7px 0;font-size:16px;cursor:pointer}.correct{outline:2px solid #555}.wrong{opacity:.55}.tag{display:inline-block;background:#eee;padding:5px 9px;border-radius:8px;font-size:13px}.tip{background:#f4f5f8;padding:13px;border-radius:12px}.score{color:#666}.loading{color:#666}</style></head><body><div class="app"><h1>🎲 TELC C1 · Lesen随机测试</h1><div class="card"><b>选择测试范围</b><div><button class="btn active" data-part="1" onclick="setPart(1,this)">Teil 1</button><button class="btn" data-part="2" onclick="setPart(2,this)">Teil 2</button><button class="btn" data-part="3" onclick="setPart(3,this)">Teil 3</button><button class="btn" data-part="all" onclick="setPart('all',this)">Teil 1+2+3</button></div><button class="btn primary" onclick="newQ()">🎲 随机出题</button><p class="score" id="score">本轮答对：0</p><p class="loading" id="status">正在自动收录题目……</p><div id="box"><p>请选择 Teil 后点击“随机出题”。</p></div></div></div><script>const API='https://api.github.com/repos/zengxiyun0068-ui/test-GPT/contents/';let part='1',pool=[],score=0,current=null;function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clean(s){return s.replace(/\s+/g,' ').trim()}function parseDoc(html,section,titleFallback){const d=new DOMParser().parseFromString(html,'text/html'),out=[];let roots=[];if(section){const sec=d.querySelector('#t'+section);if(sec)roots=[...sec.querySelectorAll(':scope > [id]')].filter(x=>/^q\d+$/.test(x.id))}else{const card=d.querySelector('.card');if(card)roots=[card]}if(!roots.length&&d.querySelector('.card'))roots=[d.querySelector('.card')];for(const root of roots){const title=clean((root.querySelector('h2')||{}).textContent||titleFallback||'TELC C1');const opts=[...root.querySelectorAll('.opt')].map(x=>clean(x.textContent));let sol=clean(root.textContent).match(/L[öo]sung\s*:\s*([^\n]+)/i);if(!sol)sol=clean(root.textContent).match(/Lösung\s*:\s*([^]+?)(?:🧠|解析|$)/i);const ans={};if(sol){for(const m of sol[1].matchAll(/(?:\(|\b)([1-6])\)?\s*[-–:]\s*([A-Ha-h])/g))ans[m[1]]=m[2].toLowerCase()}const gaps=[...root.querySelectorAll('.gap')];for(const g of gaps){const n=(g.textContent.match(/\d+/)||[])[0];if(n&&ans[n]&&opts.length)out.push({part,title,n,prompt:clean(root.innerText||root.textContent).replace(new RegExp('\\('+n+'\\)','g'),'___').slice(0,900),opts,answer:ans[n],source:title})}}return out}async function load(){try{const master=await fetch('telcc1-master.html?v=20260826-21',{cache:'no-store'}).then(r=>r.text());for(let p=1;p<=3;p++)pool.push(...parseDoc(master,p,''));const files=await fetch(API+'?ref=main',{cache:'no-store'}).then(r=>r.json());const wanted=files.filter(x=>x.type==='file'&&x.name.endsWith('.html')&&/^(teil[123]-|telcc1-teil[123]-)/i.test(x.name));for(const f of wanted){const p=(f.name.match(/(?:teil|telcc1-teil)([123])-/i)||[])[1];if(!p)continue;try{const html=await fetch(f.download_url+'?v=20260826-21',{cache:'no-store'}).then(r=>r.text());pool.push(...parseDoc(html,p,f.name))}catch(e){console.warn(f.name,e)}}const seen=new Set(),ded=[];for(const q of pool){const key=q.part+'|'+q.title+'|'+q.n;if(!seen.has(key)){seen.add(key);ded.push(q)}}pool=ded;document.getElementById('status').textContent='已自动收录 '+pool.length+' 个随机空（以后新增符合命名规则的题目会自动进入）'}catch(e){document.getElementById('status').textContent='自动收录失败，请刷新页面重试';console.error(e)}}function setPart(p,b){part=String(p);document.querySelectorAll('.btn[data-part]').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function newQ(){const arr=pool.filter(q=>part==='all'||q.part===part);if(!arr.length){document.getElementById('box').innerHTML='<p>这个 Teil 暂时没有可随机的题目。</p>';return}current=arr[Math.floor(Math.random()*arr.length)];document.getElementById('box').innerHTML='<span class="tag">Teil '+current.part+' · '+esc(current.title)+'</span><h2>第 '+current.n+' 空</h2><p>'+esc(current.prompt)+'</p>'+current.opts.map(o=>{const m=o.match(/^([A-Ha-h])[.)\s-]+(.*)$/);return '<button class="choice" onclick="pick(\''+(m?m[1].toLowerCase():o.toLowerCase())+'\',this)">'+esc(o)+'</button>'}).join('')+'<p id="r"></p>'}function pick(x,b){if(document.getElementById('r').textContent)return;document.querySelectorAll('.choice').forEach(z=>z.disabled=true);const ok=x===current.answer;if(ok){score++;b.classList.add('correct');document.getElementById('r').innerHTML='✅ <b>正确！</b>'}else{b.classList.add('wrong');document.getElementById('r').innerHTML='❌ 正确答案：<b>'+current.answer.toUpperCase()+'</b>'}document.getElementById('score').textContent='本轮答对：'+score+' 题'}load();</script></body></html>
