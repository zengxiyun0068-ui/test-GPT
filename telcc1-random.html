<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELC C1 · Teil 1 随机测试</title><style>body{margin:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}.app{max-width:850px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #0001}.choice{display:block;width:100%;text-align:left;border:0;border-radius:11px;background:#f0f2f6;padding:12px;margin:7px 0;font-size:16px}.choice:hover{background:#e5e8ef}.correct{outline:2px solid #555}.wrong{opacity:.55}.primary{border:0;border-radius:11px;padding:11px 15px;background:#222;color:#fff;font-size:15px}.tag{display:inline-block;background:#eee;padding:5px 9px;border-radius:8px;font-size:13px}.tip{background:#f4f5f8;padding:13px;border-radius:12px}.score{color:#666}</style></head><body><div class="app"><h1>🎲 TELC C1 · Lesen Teil 1</h1><p>随机测试：两篇题目共 10 个空。先选答案，再看解析。</p><div class="card"><button class="primary" onclick="newQ()">随机出题</button><p class="score" id="score">本轮答对：0</p><div id="box"><p>点击“随机出题”开始。</p></div></div></div><script>const qs=[
['Haustiere','Doch auch diese Untersuchungen beruhen auf Daten aus einschlägigen Tierarztpraxen ... (1) ___ Sie führen zu einem verzerrten Bild.',['a','b','c','d','e','f','g','h'],'e','前文批评旧研究的方法，e 具体说明 wissenschaftliche Standards wurden oft nicht beachtet。'],
['Haustiere','Führen Haustiere ihre Halter zu höherem gesundheitlichem Wohlbefinden oder nicht? (2) ___',['a','b','c','d','e','f','g','h'],'b','这里需要研究结果；b 直接给出“Tierhalter schnitten schlechter ab”。'],
['Haustiere','Die zugrunde liegenden Standards seien wissenschaftlich nicht nachprüfbar gewesen. (3) ___',['a','b','c','d','e','f','g','h'],'f','这里继续说明调查对象：höchstens drei Haustiere。'],
['Haustiere','... ging es nicht um die Frage, ob das Tier ein Problem im Haus verursacht – (4) ___',['a','b','c','d','e','f','g','h'],'d','前后存在观点修正；jedoch 是关键转折。'],
['Haustiere','Haustiere und Menschen zeigen ein gemeinsames Wohlbefinden ... (5) ___',['a','b','c','d','e','f','g','h'],'g','Zu diesem Schluss 指向前面的结论。'],
['Haustiere','Auch hier entscheidet die Zusammensetzung der Daten ... (6) ___',['a','b','c','d','e','f','g','h'],'c','solche Faktoren 承接前文 Faktoren，并说明 Kowalts 自己提出这些因素。'],
['KI','Damals beschränkten sich die Anwendungen auf einfache mathematische Probleme und Schach. (1) ___ Erst durch Big Data ...',['a','b','c','d','e','f','g','h'],'b','早期计算机的 Rechenleistung 太低，无法处理复杂模拟。'],
['KI','Viele Angestellte fürchten, dass ihre Expertise durch Algorithmen ersetzt werden könnte. (2) ___ Für spezialisierte IT-Fachkräfte ...',['a','b','c','d','e','f','g','h'],'f','让步+转折：简单重复工作可能被替代，但复杂问题仍是人的领域。'],
['KI','... müssen diese Prozesse transparent sein. (3) ___ Diese wurde von der EU-Kommission ins Leben gerufen ...',['a','b','c','d','e','f','g','h'],'d','Diese 需要一个女性单数的机构/Instanz；High-Level Expert Group 正好对应。'],
['KI','Rechenzentren weltweit rüsten auf ... (4) ___ Trotz der Effizienzgewinne ... steigt der Stromverbrauch ...',['a','b','c','d','e','f','g','h'],'e','dieser enorme Leistungsbedarf 承接前文性能需求，并自然引出 Energiebilanz。'],
['KI','Es fehlt häufig an Fachkräften ... (5) ___ Zudem schrecken hohe Investitionskosten ... ab.',['a','b','c','d','e','f','g','h'],'a','diesen Mangel 指缺少 Fachkräfte；a 给出培训和高校合作的解决方案。'],
['KI','Dennoch ist der Trend unumkehrbar. (6) ___ Wer heute nicht in digitale Kompetenzen investiert ...',['a','b','c','d','e','f','g','h'],'h','结尾总结成功因素：Innovationskraft und Anpassungsfähigkeit。']];let s=0,q=null;function newQ(){q=qs[Math.floor(Math.random()*qs.length)];document.getElementById('box').innerHTML='<span class="tag">'+q[0]+'</span><h2>'+q[1]+'</h2>'+q[2].map(x=>'<button class="choice" onclick="pick(\''+x+'\',this)\">'+x+'</button>').join('')+'<p id="r"></p>'}function pick(x,b){if(document.getElementById('r').textContent)return;document.querySelectorAll('.choice').forEach(z=>z.disabled=true);if(x===q[3]){s++;b.classList.add('correct');document.getElementById('r').innerHTML='✅ <b>正确！</b><div class="tip">'+q[4]+'</div>'}else{b.classList.add('wrong');document.getElementById('r').innerHTML='❌ 正确答案：<b>'+q[3]+'</b><div class="tip">'+q[4]+'</div>'}document.getElementById('score').textContent='本轮答对：'+s+' 题'}</script></body></html>
